/* ===== core: base + components ===== */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ background:var(--bg); color:var(--ink); font:var(--fw-regular) var(--fs-md)/var(--lh) var(--font); margin:0; min-height:100vh; }
[hidden]{ display:none !important; }
h1,h2,h3,p{ margin:0; }
img{ max-width:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--accent-ink); }
:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
html.has-overlay{ overflow:hidden; }

.row{ display:flex; align-items:center; gap:var(--sp-2); min-width:0; }
.row-wrap{ flex-wrap:wrap; }
.grow{ flex:1 1 auto; min-width:0; }
.stack-1,.stack-2,.stack-3,.stack-4{ display:flex; flex-direction:column; min-width:0; }
.stack-1{ gap:var(--sp-1); } .stack-2{ gap:var(--sp-2); } .stack-3{ gap:var(--sp-3); } .stack-4{ gap:var(--sp-4); }
.muted{ color:var(--ink-2); }
.faint{ color:var(--ink-3); }
.num{ font-variant-numeric:tabular-nums; }
.mono{ font-family:var(--mono); }
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.only-mobile{ display:none !important; }
.sticky-bar{ position:sticky; top:0; z-index:var(--z-sticky); background:var(--bg); padding:var(--sp-2) 0; }
.page-stack{ display:flex; flex-direction:column; gap:var(--sp-4); }

.brand-mark{ display:inline-block; flex:none; width:32px; height:32px; border-radius:var(--r-sm); background:var(--surface-2) var(--logo-url) center/cover no-repeat; }
.brand-mark.is-lg{ width:56px; height:56px; border-radius:var(--r-md); }

/* buttons */
.btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--control-h); padding:0 14px; border-radius:var(--r-sm); border:1px solid transparent; font-size:var(--fs-md); font-weight:var(--fw-semibold); line-height:1; white-space:nowrap; cursor:pointer; text-decoration:none; transition:background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease); -webkit-tap-highlight-color:transparent; }
.btn svg{ width:16px; height:16px; flex:none; }
.btn-primary{ background:var(--accent); color:var(--on-accent); }
.btn-primary:hover{ background:var(--accent-hover); }
.btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--line-input); }
.btn-secondary:hover{ background:var(--surface-2); }
.btn-ghost{ background:transparent; color:var(--ink-2); }
.btn-ghost:hover{ background:var(--surface-2); color:var(--ink); }
.btn-danger{ background:var(--danger-solid); color:var(--on-danger); }
.btn-danger:hover{ filter:brightness(.92); }
.btn-sm{ height:30px; padding:0 10px; font-size:var(--fs-sm); }
.btn-icon{ width:var(--control-h); padding:0; }
.btn-sm.btn-icon{ width:30px; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.btn.is-loading{ color:transparent !important; cursor:progress; opacity:1; }
.btn.is-loading::after{ content:""; position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; border:2px solid var(--ink-3); border-top-color:transparent; animation:tr-spin .7s linear infinite; }
.btn-primary.is-loading::after{ border-color:var(--on-accent); border-top-color:transparent; }
.btn-danger.is-loading::after{ border-color:var(--on-danger); border-top-color:transparent; }
@keyframes tr-spin{ to{ transform:rotate(360deg); } }
.link{ background:none; border:0; padding:0; color:var(--accent-ink); font-weight:var(--fw-semibold); cursor:pointer; text-decoration:none; }
.link:hover{ text-decoration:underline; }

/* shell */
.shell{ display:grid; grid-template-columns:var(--sidebar-w) minmax(0,1fr); min-height:100vh; }
.sidebar{ position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:var(--sp-1); padding:var(--sp-4) var(--sp-3); background:var(--surface); border-right:1px solid var(--line); z-index:var(--z-nav); overflow-y:auto; }
.sidebar-brand{ display:flex; align-items:center; gap:var(--sp-2); padding:0 var(--sp-2) var(--sp-4); font-weight:var(--fw-bold); font-size:var(--fs-lg); }
.sidebar-nav{ display:flex; flex-direction:column; gap:2px; }
.sidebar-spacer{ flex:1 1 auto; }

/* login */

/* switches */

.sheet-item{ display:flex; align-items:center; gap:var(--sp-3); width:100%; min-height:48px; padding:0 var(--sp-4); border:0; background:transparent; color:var(--ink); font-size:var(--fs-lg); text-align:left; text-decoration:none; cursor:pointer; }

          cancelBtn.disabled = busy; ui.closeBtn.disabled = busy;
          if (typeInput) typeInput.disabled = busy;
        },
        close: function(){ finish(true); }
      };
      function finish(val){
        if (done) return; done = true;

        var p;
        try { p = Promise.resolve(c.onConfirm(ctl)); } catch (e) { p = Promise.reject(e); }

  function normOptions(opts){
    return (opts || []).map(function(o){ return (o && typeof o === 'object') ? { value: o.value, label: o.label == null ? String(o.value) : o.label } : { value: o, label: String(o) }; });
  }

  TR.dialog.form = function(cfg){
    var c = cfg || {};
    var level = c.level === 'C' ? 'C' : (c.level === 'B' ? 'B' : 'A');
    return new Promise(function(resolve){
      var busy = false, done = false, step = 'form', entry, initialSnap = '';
      var ui = buildModalShell({ title: c.title, danger: false, onCloseRequest: requestClose });
      if (level === 'C') { ui.dialog.classList.add('is-danger'); ui.title.textContent = '⚠ ' + (c.title || ''); }
      var form = h('form', { class: 'dialog-form', attrs: { novalidate: true } });
      if (c.description) form.appendChild(h('p', { class: 'dialog-desc', text: c.description }));
      var controls = {}, segs = {}, customVals = {};
      var fields = c.fields || [];

      fields.forEach(function(f){
        var fid = nextId('f');
        var wrap = h('div', { class: 'field', dataset: { fieldId: f.id } });
        var ctlEl;
        if (f.type === 'checkbox') {
          ctlEl = h('input', { type: 'checkbox', id: fid, checked: !!f.value, disabled: !!f.disabled });
          wrap.appendChild(h('label', { class: 'check', for: fid }, ctlEl, h('span', { text: f.label || '' })));
        } else {
          if (f.type !== 'custom' || f.label) wrap.appendChild(h('label', { class: 'field-label', for: fid, text: f.label || '' }));
          if (f.type === 'textarea') {
            ctlEl = h('textarea', { class: 'textarea', id: fid, rows: f.rows || 4, placeholder: f.placeholder || '', disabled: !!f.disabled });
            ctlEl.value = f.value == null ? '' : String(f.value);
            if (f.maxLength) ctlEl.maxLength = f.maxLength;
            wrap.appendChild(ctlEl);
          } else if (f.type === 'select') {
            ctlEl = h('select', { class: 'select', id: fid, disabled: !!f.disabled });
            normOptions(f.options).forEach(function(o){
              var opt = h('option', { value: String(o.value), text: o.label });
              if (String(o.value) === String(f.value)) opt.selected = true;
              ctlEl.appendChild(opt);
            });
            wrap.appendChild(ctlEl);
          } else if (f.type === 'segmented') {
            var items = normOptions(f.options);
            var seg = TR.ui.segmented({ items: items, value: f.value != null ? f.value : (items[0] && items[0].value), ariaLabel: f.label, onChange: function(){ fireChange(f.id); } });
            seg.el.id = fid;
            segs[f.id] = seg;
            ctlEl = seg.el;
            wrap.appendChild(ctlEl);
          } else if (f.type === 'custom') {
            ctlEl = h('div', { class: 'field-custom', id: fid });
            wrap.appendChild(ctlEl);
          } else {
            var t = f.type === 'number' ? 'number' : 'text';
            ctlEl = h('input', { class: 'input', id: fid, type: t, placeholder: f.placeholder || '', disabled: !!f.disabled, attrs: { autocomplete: 'off' } });
            if (f.type === 'coord') { ctlEl.setAttribute('inputmode', 'decimal'); ctlEl.setAttribute('spellcheck', 'false'); }
            if (t === 'number') { ctlEl.setAttribute('inputmode', 'decimal'); if (f.min != null) ctlEl.min = f.min; if (f.max != null) ctlEl.max = f.max; }
            if (f.maxLength) ctlEl.maxLength = f.maxLength;
            ctlEl.value = f.value == null ? '' : String(f.value);
            if (f.type === 'coord') wrap.appendChild(h('div', { class: 'field-control' }, ctlEl));
            else wrap.appendChild(ctlEl);
          }
        }
        if (f.hint) wrap.appendChild(h('p', { class: 'field-hint', text: f.hint }));
        controls[f.id] = { f: f, el: ctlEl, wrap: wrap };
        form.appendChild(wrap);
      });

      var reviewPane = h('div', { class: 'dialog-form', hidden: true });
      var errs = errorArea();
      ui.body.appendChild(form);
      ui.body.appendChild(reviewPane);
      ui.body.appendChild(errs.el);

      var cancelBtn = h('button', { class: 'btn btn-secondary', type: 'button', text: c.cancelText || '取消' });
      var submitBtn = h('button', { class: 'btn ' + (level === 'C' ? 'btn-danger' : 'btn-primary'), type: 'button', text: c.submitText || '儲存' });
      ui.foot.appendChild(cancelBtn); ui.foot.appendChild(submitBtn);
      var reviewTypeInput = null;

      function values(){
        var v = {};
        fields.forEach(function(f){
          var k = controls[f.id];
          if (f.type === 'checkbox') v[f.id] = !!k.el.checked;
          else if (f.type === 'segmented') v[f.id] = segs[f.id].value();
          else if (f.type === 'custom') v[f.id] = customVals[f.id];
          else if (f.type === 'number') { var s = String(k.el.value).trim(); v[f.id] = s === '' ? '' : Number(s); }
          else v[f.id] = k.el.value;
        });
        return v;
      }
      function snap(){ try { return JSON.stringify(values()); } catch (e) { return ''; } }
      var ctl = {
        values: values,
        field: function(id){ return controls[id] ? controls[id].el : null; },
        setValue: function(id, val){
          var k = controls[id]; if (!k) return;
          if (k.f.type === 'checkbox') k.el.checked = !!val;
          else if (k.f.type === 'segmented') segs[id].set(val);
          else if (k.f.type === 'custom') customVals[id] = val;
          else k.el.value = val == null ? '' : String(val);
        },
        setDisabled: function(id, b){
          var k = controls[id]; if (!k) return;
          if (k.f.type === 'segmented') Array.prototype.forEach.call(k.el.querySelectorAll('button'), function(x){ x.disabled = !!b; });
          else k.el.disabled = !!b;
        },
        setError: function(text, tech){ errs.set(text, tech); },
        setBusy: function(b){
          busy = !!b;
          submitBtn.classList.toggle('is-loading', busy);
          submitBtn.disabled = busy || (reviewTypeInput && step === 'review' ? reviewTypeInput.value !== reviewTypeInput._need : false);
          cancelBtn.disabled = busy; ui.closeBtn.disabled = busy;
        },
        close: function(result){ finish(true, result); }
      };
      function fireChange(id){ if (typeof c.onChange === 'function') { try { c.onChange(id, values(), ctl); } catch (e) { reportError(e); } } }
      fields.forEach(function(f){
        var k = controls[f.id];
        if (f.type === 'segmented' || f.type === 'custom') return;
        k.el.addEventListener(f.type === 'checkbox' || f.type === 'select' ? 'change' : 'input', function(){ fireChange(f.id); });
        if (f.type !== 'textarea') k.el.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); submitBtn.click(); } });
      });
      fields.forEach(function(f){ if (f.type === 'custom' && typeof f.render === 'function') { try { f.render(controls[f.id].el, ctl); } catch (e) { reportError(e); } } });

      function isDirty(){ return step === 'review' || snap() !== initialSnap; }
      function finish(submitted, result){
        if (done) return; done = true;
        removeOverlay(entry);
        resolve({ submitted: !!submitted, result: result });
      }
      function requestClose(){
        if (busy) return;
        if (!isDirty()) { finish(false); return; }
        TR.dialog.confirm({ title: '放棄未儲存的內容?', body: '剛才輸入的內容不會被儲存。', confirmText: '放棄', cancelText: '繼續編輯', level: 'B' })
          .then(function(ok){ if (ok) finish(false); });
      }
      function showForm(){
        step = 'form';
        form.hidden = false; reviewPane.hidden = true;
        submitBtn.textContent = c.submitText || '儲存';
        cancelBtn.textContent = c.cancelText || '取消';
        submitBtn.disabled = false;
        errs.set('');
      }
      function showReview(vals){
        var rv;
        try { rv = c.review(vals) || {}; } catch (e) { errs.set('發生錯誤,請稍後再試', String(e && e.message || e)); return; }
        step = 'review';
        reviewPane.textContent = '';
        reviewTypeInput = null;
        reviewPane.appendChild(h('p', { class: 'field-label', text: rv.title || '請確認以下變更' }));
        if (rv.rows && rv.rows.length) reviewPane.appendChild(reviewRowsNode(rv.rows));
        if (rv.note) reviewPane.appendChild(h('p', { class: 'dialog-note', text: rv.note }));
        submitBtn.textContent = '確認';
        submitBtn.disabled = false;
        if (rv.requireType) {
          var rid = nextId('req');
          reviewTypeInput = h('input', { class: 'input', id: rid, type: 'text', attrs: { autocomplete: 'off' } });
          reviewTypeInput._need = String(rv.requireType);
          reviewPane.appendChild(h('div', { class: 'field' }, h('label', { class: 'field-label', for: rid, text: '請輸入「' + rv.requireType + '」以確認' }), reviewTypeInput));
          submitBtn.disabled = true;
          reviewTypeInput.addEventListener('input', function(){ submitBtn.disabled = reviewTypeInput.value !== reviewTypeInput._need; });
        }
        cancelBtn.textContent = '返回修改';
        form.hidden = true; reviewPane.hidden = false;
        errs.set('');
        setTimeout(function(){ (reviewTypeInput || submitBtn).focus(); }, 0);
      }
      function doSubmit(vals){
        errs.set('');
        ctl.setBusy(true);
        var p;
        try { p = Promise.resolve(c.onSubmit ? c.onSubmit(vals, ctl) : true); } catch (e) { p = Promise.reject(e); }
        p.then(function(r){
          ctl.setBusy(false);
          if (done || r === false) return;
          finish(true, r);
        }, function(e){
          ctl.setBusy(false);
          if (!errs.el.textContent) errs.set('發生錯誤,請稍後再試', String(e && e.message || e));
        });
      }
      cancelBtn.addEventListener('click', function(){
        if (busy) return;
        if (step === 'review') { showForm(); return; }
        finish(false);
      });
      submitBtn.addEventListener('click', function(){
        if (busy || submitBtn.disabled) return;
        if (step === 'review') { doSubmit(values()); return; }
        var vals = values();
        for (var i = 0; i < fields.length; i++) {
          var f = fields[i];
          if (!f.required || f.disabled) continue;
          var v = vals[f.id];
          if (v == null || (typeof v === 'string' && v.trim() === '') || v === false) {
            errs.set('請填寫「' + (f.label || f.id) + '」');
            var el = controls[f.id].el; if (el && el.focus) el.focus();
            return;
          }
        }
        if (typeof c.validate === 'function') {
          var msg = null;
          try { msg = c.validate(vals); } catch (e) { msg = '發生錯誤,請稍後再試'; }
          if (msg) { errs.set(msg); return; }
        }
        if (typeof c.review === 'function') { showReview(vals); return; }
        doSubmit(vals);
      });
      form.addEventListener('submit', function(ev){ ev.preventDefault(); submitBtn.click(); });

      overlayRoot.appendChild(ui.scrim);
      entry = pushOverlay({ root: ui.scrim, trap: ui.dialog, modal: true, requestClose: requestClose, forceClose: function(){ finish(false); } });
      initialSnap = snap();
      setTimeout(function(){
        var first = form.querySelector('input:not([disabled]),select:not([disabled]),textarea:not([disabled]),.seg-btn[aria-selected="true"]');
        if (first) first.focus(); else submitBtn.focus();
      }, 0);
    });
  };

  TR.drawer = function(cfg){
    var c = cfg || {};

    var scrim = h('div', { class: 'scrim is-drawer' });
    var panel = h('aside', { class: 'drawer' + (c.wide ? ' is-wide' : ''), attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId } });

    panel.appendChild(body); panel.appendChild(foot);
    scrim.appendChild(panel);
    function hasDraft(){

    }

      TR.dialog.confirm({ title: '放棄未儲存的內容?', body: '剛才輸入的內容不會被儲存。', confirmText: '放棄', cancelText: '繼續編輯', level: 'B' })
        .then(function(ok){ if (ok) close(); });

    scrim.addEventListener('click', function(ev){ if (ev.target === scrim && scrim._down) requestClose(); });

      close: close,
      setTitle: function(t){ title.textContent = t || ''; },
      body: body,
      foot: foot,
      setBusy: function(b){ busy = !!b; closeBtn.disabled = busy; },
      setDirty: function(b){ dirty = !!b; }
    };

    entry = pushOverlay({ root: scrim, trap: panel, modal: true, requestClose: requestClose, forceClose: close });

  function openSheet(o){

  function placeFloating(el, anchor, align){
    el.classList.add('is-measuring');
    overlayRoot.appendChild(el);
    var r = anchor.getBoundingClientRect();
    var w = el.offsetWidth, hgt = el.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var x = align === 'start' ? r.left : r.right - w;
    if (align === 'center') x = r.left + r.width / 2 - w / 2;
    x = Math.max(8, Math.min(x, vw - w - 8));
    var y = r.bottom + 6;
    if (y + hgt > vh - 8 && r.top - hgt - 6 > 8) y = r.top - hgt - 6;
    y = Math.max(8, Math.min(y, vh - hgt - 8));
    el.style.setProperty('--mx', Math.round(x) + 'px');
    el.style.setProperty('--my', Math.round(y) + 'px');
    el.classList.remove('is-measuring');
  }

  function openMenu(anchor, items, label){
    var menu = h('div', { class: 'menu', attrs: { role: 'menu', 'aria-label': label || '更多動作' } });
    var closed = false, entry;
    function close(restore){
      if (closed) return; closed = true;
      anchor.setAttribute('aria-expanded', 'false');
      removeOverlay(entry, restore);
    }
    items.forEach(function(it){
      if (!it || it.hidden) return;
      if (it.separator) { menu.appendChild(h('div', { class: 'menu-sep', attrs: { role: 'separator' } })); return; }
      var isLink = !!it.href;
      var el = h(isLink ? 'a' : 'button', { class: 'menu-item' + (it.danger ? ' is-danger' : ''), attrs: { role: 'menuitem', tabindex: '-1' } });
      if (isLink) { el.href = it.href; if (/^https?:/i.test(it.href)) { el.target = '_blank'; el.rel = 'noopener'; } }
      else el.type = 'button';
      if (it.icon) el.appendChild(TR.icon(it.icon));
      el.appendChild(h('span', { text: it.label }));
      if (it.selected) el.appendChild(h('span', { class: 'sheet-check', text: '✓', attrs: { 'aria-hidden': 'true' } }));
      el.addEventListener('click', function(){
        close(true);
        if (typeof it.onClick === 'function') { try { var r = it.onClick(); if (r && r.catch) r.catch(reportError); } catch (e) { reportError(e); } }
      });
      menu.appendChild(el);
    });
    menu.addEventListener('keydown', function(ev){
      var list = Array.prototype.slice.call(menu.querySelectorAll('.menu-item'));
      var i = list.indexOf(document.activeElement);
      if (ev.key === 'ArrowDown') { ev.preventDefault(); list[(i + 1) % list.length].focus(); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
      else if (ev.key === 'Home') { ev.preventDefault(); list[0].focus(); }
      else if (ev.key === 'End') { ev.preventDefault(); list[list.length - 1].focus(); }

    entry = pushOverlay({ root: menu, anchor: anchor, modal: false, lightDismiss: true, requestClose: function(reason){ close(reason === 'esc'); }, forceClose: function(){ close(false); } });

    return { close: close };
  }
  TR._openMenu = openMenu;

  TR.ui.button = function(o){

    var b = h('button', { class: 'btn btn-' + variant + (c.size === 'sm' ? ' btn-sm' : '') + (c.className ? ' ' + c.className : ''), type: c.type || 'button', disabled: !!c.disabled });
    if (c.title) b.title = c.title;
    if (c.attrs) Object.keys(c.attrs).forEach(function(a){ if (c.attrs[a] != null) b.setAttribute(a, c.attrs[a]); });
    if (c.icon) b.appendChild(TR.icon(c.icon));
    if (c.label != null && c.label !== '') b.appendChild(h('span', { text: c.label }));
    else if (c.icon) { b.classList.add('btn-icon'); if (c.title) b.setAttribute('aria-label', c.title); }
    b.addEventListener('click', function(ev){
      if (b.classList.contains('is-loading') || typeof c.onClick !== 'function') return;

      try { r = c.onClick(ev); } catch (e) { reportError(e); return; }

      }
    });
    return b;
  };

  /* ---------- poll ---------- */

      if (!hasOwn(map, r.day)) { map[r.day] = { day: r.day, google: 0, geo: 0, places: 0, free: 0, rescue: 0, rate: 0 }; order.push(r.day); }
      var m = map[r.day], n = num0(r.n);
      if (M.GOOGLE_APIS.indexOf(r.api) >= 0) {
        m.google += n;
        if (r.api === 'places') m.places += n;
      } else if (M.FREE_HIT_APIS.indexOf(r.api) >= 0) m.free += n;
      else if (M.AI_RESCUE_APIS.indexOf(r.api) >= 0) m.rescue += n;
    });
    return sortDayKeys(order).map(function(d){
      var m = map[d];
      m.geo = m.google - m.places;
      m.rate = (m.free + m.google) > 0 ? Math.round(m.free * 100 / (m.free + m.google)) : 0;
      return m;
    });
  };
  M.distanceSelfShare = function(geoRes){

    var fallback = M.geoSum(t, ['distance_geoapify', 'distance_google', 'map8_route']);
    var tot = self + fallback;
    return { pct: tot ? Math.round(self * 100 / tot) : null, self: self, fallback: fallback };
  };

      var t = 0, m = 0;
      today.forEach(function(r){ if (r && r.api === k) t = num0(r.n); });
      month.forEach(function(r){ if (r && r.api === k) m = num0(r.n); });
      if (!t && !m) return;
      out.push({ api: k, label: p.label, today: t, month: m, free: p.free, per1000: p.per1000 });

  function driverQuery(rows, lic){
    var list = rows || [];
    for (var i = 0; i < list.length; i++) { if (list[i] && list[i].key === lic && list[i].driver_name) return String(list[i].driver_name); }

  function nameOfLic(rows, lic){
    var list = rows || [], i, r;
    for (i = 0; i < list.length; i++) { r = list[i]; if (r && r.key === lic) return r.driver_name || maskKey(lic); }
    var pre = String(lic || '').slice(0, 8);
    var hit = null, count = 0;
    for (i = 0; i < list.length; i++) {
      r = list[i];
      if (r && typeof r.key === 'string' && r.key.indexOf('····') > 0 && r.key.slice(0, 8) === pre) { hit = r; count++; }
    }
    if (count === 1) return hit.driver_name || maskKey(lic);

    if (geoRes && Array.isArray(geoRes.testers)) return geoRes.testers;

  M.adviceTips = function(geoRes, licenseRows){
    if (!geoRes || !geoRes.ok) return [];
    var T = statRows(geoRes, 'today'), Mo = statRows(geoRes, 'month');
    var s = geoRes.stats || {};
    function g1(arr, a){ return M.geoSum(arr, [a]); }
    function pctf(x){ return Math.round(x * 100); }
    var cost = M.monthlyCost(geoRes).usageUsd;
    var gToday = M.geoSum(T, M.GOOGLE_APIS), hits = M.geoSum(T, M.FREE_HIT_APIS);
    var geoT = g1(T, 'geocode'), nomiT = g1(T, 'geocode_nominatim'), placesT = g1(T, 'places'), blockedT = g1(T, 'budget_blocked');
    var geoM = g1(Mo, 'geocode'), placesM = g1(Mo, 'places'), distGM = g1(Mo, 'distance_google');
    var hitDen = gToday + hits, hitRate = hitDen ? hits / hitDen : null;
    var tips = [];

    if (cost <= 0.005) {
      tips.push({ id: 'cost-none', s: 0, title: '本月目前沒有 Google 費用', detail: '查位置與距離都走免費來源與快取,沒有產生 Google 費用。' });
    } else {
      var paid = [['Google 地址定位', Math.max(0, geoM - 10000) * 5 / 1000],
                  ['Google 地標搜尋', Math.max(0, placesM - 10000) * 5 / 1000],
                  ['Google 距離計算', Math.max(0, distGM - 10000) * 5 / 1000]];
      paid.sort(function(a, b){ return b[1] - a[1]; });
      tips.push({ id: 'cost-some', s: 3, title: '本月已產生 US$' + cost.toFixed(2) + ',主要來自「' + paid[0][0] + '」', detail: '這是依 Google 公開價目的估算,實際金額以 Google 帳單為準,這裡適合看趨勢。' });
    }
    var now = new Date(), dom = now.getDate(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    function proj(m){ return Math.round(m / dom * dim); }
    var pc = Math.max(0, proj(geoM) - 10000) * 5 / 1000 + Math.max(0, proj(placesM) - 10000) * 5 / 1000 + Math.max(0, proj(distGM) - 10000) * 5 / 1000;
    if (pc >= cost + 1) {
      tips.push({ id: 'projection', s: 2, title: '照目前用量,月底 Google 費用約 US$' + pc.toFixed(0), detail: '目前是 US$' + cost.toFixed(2) + '。地址定位本月推估約 ' + loc(proj(geoM)) + ' 次,每月免費額度是 10,000 次。' });
    }
    var geoDen = geoT + nomiT;
    if (geoT > 0 && geoDen > 0) {
      var share = geoT / geoDen;
      if (share > 0.3) {
        tips.push({ id: 'paid-share', s: 2, title: '今天有 ' + pctf(share) + '% 的地址查詢用了付費 Google', detail: '共 ' + loc(geoT) + ' 次,每千次約 US$5。自有定位伺服器正常時這個比例應該很低,請確認它運作正常。' });
      } else if (nomiT > 0) {
        tips.push({ id: 'self-share', s: 0, title: '地址查詢 ' + pctf(nomiT / geoDen) + '% 已走自有伺服器', detail: '只剩少數查不到的地址才會用到 Google。' });
      }
    }
    if (placesM > 10000) {
      tips.push({ id: 'places-month', s: 3, title: '地標搜尋本月已超過免費額度', detail: '本月已用 ' + loc(placesM) + ' 次,超過每月免費 10,000 次的部分每千次約 US$5。把常查不到的地點補進位置庫最有效,補進去之後就不再花錢。' });
    } else if (placesT > 0) {
      tips.push({ id: 'places-today', s: 2, title: '今天用了 ' + loc(placesT) + ' 次地標搜尋', detail: '通常是單上只寫地名、查不到門牌時才會用到。量持續偏高時,值得把常見地點補進位置庫。' });
    }
    if (hitRate != null && hitRate >= 0.85) {
      tips.push({ id: 'hit-good', s: 0, title: '免費命中率 ' + pctf(hitRate) + '%,狀況良好', detail: '大部分查詢不用付費就查到位置。' });
    }
    if (!s.cap) {
      tips.push({ id: 'no-cap', s: 1, title: '還沒設定 Google 每日上限', detail: '建議設定一個上限(例如 8,000),萬一查詢量異常暴增,也不會產生大筆帳單。', route: 'system?s=caps' });
    }
    if (blockedT > 0) {
      tips.push({ id: 'blocked', s: 2, title: '今天有 ' + loc(blockedT) + ' 次因每日上限被擋', detail: '被擋的卡片會少了距離或位置。如果是正常成長就調高上限;如果不正常,先看是哪位司機查詢特別多。', route: 'system?s=caps' });
    }
    var testers = M.testerKeys(geoRes);
    var dr = (Array.isArray(s.today_by_driver) ? s.today_by_driver : []).filter(function(r){ return r && testers.indexOf(r.lic) < 0; });
    if (dr.length >= 2 && num0(dr[0].n) > 200 && num0(dr[0].n) > num0(dr[1].n) * 3) {
      tips.push({ id: 'driver-spike', s: 2, title: '司機「' + nameOfLic(licenseRows, dr[0].lic) + '」今天查詢 ' + loc(dr[0].n) + ' 次,遠高於其他人', detail: '可能一直查不到而重複查詢,值得看看他收到的單。', route: 'drivers?f=all&q=' + encodeURIComponent(driverQuery(licenseRows, dr[0].lic)) });
    }
    tips.forEach(function(t, i){ t._i = i; });
    tips.sort(function(a, b){ return (b.s - a.s) || (a._i - b._i); });
    tips.forEach(function(t){ delete t._i; });
    return tips;
  };

  function riskBadge(r){
    if (r.test) return TR.ui.badge('測試機', 'neutral');
    if (num(r.score) >= 50) return TR.ui.badge('高風險 ' + r.score, 'danger');
    if (num(r.score) > 0) return TR.ui.badge('觀察 ' + r.score, 'warn');
    return TR.ui.badge('正常', 'ok');
  }
  function loadAbuse(){
    if (!S.cards.abuse || AB.loading) return Promise.resolve();
    AB.loading = true;
    return TR.api('abuseWatch', {}).then(function(res){
      AB.loading = false;
      if (res && res.ok && Array.isArray(res.rows)) { AB.rows = res.rows; AB.cap = res.cap; AB.error = null; AB.loadedAt = Date.now(); }
      else AB.error = res;
      guard(S.cards.abuse, renderAbuse);
    });
  }
  function renderAbuse(){
    var card = S.cards.abuse; if (!card) return;
    if (!AB.rows) {
      if (AB.error) { AB.body.textContent = ''; AB.table = null; AB.body.appendChild(errState('暫時讀不到高風險用量', AB.error, loadAbuse)); }

    var rows = AB.rows;
    var risky = rows.filter(function(r){ return !r.test && num(r.score) > 0; });
    AB.stateHost.textContent = '';

          { key: 'score', label: '風險', mobile: 'sub', render: riskBadge },
          { key: 'total', label: '24 小時查詢', align: 'right', className: 'num', render: function(r){ return fmtN(r.total); } },
          { key: 'geo', label: '地址查詢', align: 'right', className: 'num', render: function(r){ return fmtN(r.geo); } },
          { key: 'missRate', label: '查無率', align: 'right', className: 'num', render: function(r){ return num(r.missRate) + '%'; } },

  // ----- 4. classifier -----
  function buildClassifier(){
    return TR.ui.card({ id: 'sys-classifier', title: '查無原因分類', collapsible: true, open: false, info: '今天查不到位置的單,由 AI 判斷主要原因。佔比最高的一類優先處理,效果最大。' });
  }
  function renderClassifier(){
    var card = S.cards.classifier; if (!card) return;
    var st = TR.data.get('geoUsage');
    if (!st.value) {
      clsSig = null;
      card.body.textContent = '';
      if (st.error) card.body.appendChild(errState('暫時讀不到分類資料', st.error));
      else card.body.appendChild(TR.ui.skeleton({ lines: 3 }));
      return;
    }
    var today = (st.value.stats && st.value.stats.today) || [];
    var rows = [], total = 0;
    CLS.forEach(function(c){
      var n = sumApis(today, ['ai_cls_' + c.k]);
      if (n > 0) { rows.push({ c: c, n: n }); total += n; }
    });
    var sig = JSON.stringify(rows.map(function(r){ return [r.c.k, r.n]; }));
    if (sig === clsSig && card.body.firstChild) return;
    clsSig = sig;
    card.body.textContent = '';
    if (!total) { card.body.appendChild(TR.ui.emptyState({ title: '今天還沒有查無的單' })); return; }
    rows.sort(function(a, b){ return b.n - a.n; });
    card.body.appendChild(h('p', { class: 'sys-note', text: '今日共 ' + fmtN(total) + ' 張單查不到位置,原因分布如下。' }));
    var wrap = h('div', { class: 'stack-3' });
    wrap.appendChild(TR.ui.barList({ rows: rows.map(function(r){
      var pct = Math.round(r.n * 100 / total);
      return { label: r.c.t, value: fmtN(r.n) + ' 筆・' + pct + '%', sub: r.c.fix || null, pct: pct, tone: r.c.tone };
    }) }));
    if (TR.can('write')) wrap.appendChild(h('p', { class: 'sys-note' }, '原文可到 ', h('a', { class: 'link', href: '難單紀錄.html', text: '難單紀錄 ›' }), ' 查看。'));
    card.body.appendChild(wrap);
  }

  function buildAiRules(){

    card.body.appendChild(AR.content);

      h('div', { class: 'stack-1' },

      AR.content.appendChild(h('p', { class: 'sys-fixed-label', text: '規則(每行一條)' }));
      AR.content.appendChild(AR.ta);
    } else {
      AR.content.appendChild(h('p', { class: 'sys-fixed-label', text: '目前規則' }));
      AR.pre = h('pre', { class: 'pre' });
      AR.content.appendChild(AR.pre);
    }

      AR.note = h('input', { class: 'input', type: 'text', placeholder: '改動理由(建議填寫,出問題時方便追查)', attrs: { 'aria-label': '改動理由', maxlength: '200', 'data-initial': '' } });
      AR.content.appendChild(h('div', { class: 'sys-rules-foot' },
        AR.note,
        TR.ui.button({ label: '儲存並套用', variant: 'primary', onClick: saveRules }),
        TR.ui.button({ label: '還原成原廠預設', onClick: restoreDefault })));
    }
    AR.histHost = h('div', { class: 'sys-hist stack-1' });

    AR.content.appendChild(AR.techHost);

    card.el.addEventListener('toggle', function(){ if (card.el.open && !AR.loaded && !AR.loading) loadAiRules(); });
    return card;
  }
  function loadAiRules(){
    if (!S.cards.airules) return Promise.resolve();
    if (AR.loading) { AR.reloadPending = true; return Promise.resolve(); }
    AR.loading = true;
    return TR.api('getAiPrompt', { which: 'rescue' }).then(function(res){
      AR.loading = false;
      if (AR.reloadPending) { AR.reloadPending = false; return loadAiRules(); }
      if (res && res.ok) {
        AR.loaded = true; AR.res = res;
        fillAiRules(res);
      } else if (!AR.loaded) {
        AR.msgHost.textContent = '';
        AR.msgHost.appendChild(errState('暫時讀不到規則', res, loadAiRules));
      } else {
        var e = TR.err(res);
        TR.toast({ type: 'err', text: '規則重新整理失敗:' + e.text, detail: e.tech });
      }
    });
  }
  function isCustom(res){ return !!(res && res.rules != null && String(res.rules).trim()); }
  function fillAiRules(res){
    AR.defaults = res.defaults || '';
    var custom = isCustom(res);
    var effective = custom ? String(res.rules) : AR.defaults;
    AR.msgHost.textContent = '';
    AR.content.hidden = false;
    AR.badgeHost.textContent = '';
    AR.badgeHost.appendChild(custom ? TR.ui.badge('已自訂', 'warn') : TR.ui.badge('原廠預設', 'ok'));
    if (AR.ta) {
      if (document.activeElement !== AR.ta && AR.ta.value === AR.ta.getAttribute('data-initial')) {
        AR.ta.value = effective;
        AR.ta.setAttribute('data-initial', effective);
      }
    } else if (AR.pre) {
      AR.pre.textContent = effective || '(沒有規則)';
    }
    AR.histHost.textContent = '';
    var hist = (res.history || []).slice(0, 5);
    AR.histHost.appendChild(h('p', { class: 'sys-fixed-label', text: '最近 ' + hist.length + ' 個版本' }));
    if (!hist.length) AR.histHost.appendChild(h('p', { class: 'sys-note', text: '還沒有修改紀錄' }));
    var list = h('div', { class: 'list' });
    hist.forEach(function(v){
      var row = h('div', { class: 'list-row' },
        h('span', { class: 'list-meta num', text: TR.fmt.dateTime(v.created_at) + '・' + (v.changed_by || '—') }),
        h('span', { class: 'sys-hist-note truncate', text: v.note || '未寫理由', title: v.note || '' }));
      if (AR.ta) row.appendChild(TR.ui.button({ label: '回滾', size: 'sm', variant: 'ghost', onClick: function(){ rollbackTo(v); } }));
      list.appendChild(row);
    });
    AR.histHost.appendChild(list);
    AR.techHost.textContent = '';
    var ai = res.ai;
    if (ai && ai.main) {
      AR.techHost.appendChild(TR.ui.tech('使用模型:' + ai.main + (ai.classifier && ai.classifier !== ai.main ? ' / 分類:' + ai.classifier : '') + (ai.provider ? ' / ' + ai.provider : '')));
    }
  }
  function saveRules(){
    if (!AR.ta || !AR.loaded) { TR.toast({ type: 'info', text: '規則還沒載入,請稍候' }); return; }
    var v = AR.ta.value;

    var noteVal = AR.note ? AR.note.value : '';

      title: '儲存並套用規則?',

  function buildStorage(){
    var card = TR.ui.card({ id: 'sys-storage', title: '空間與清理', info: '用量紀錄是唯一會持續變大的資料。刪除後檔案不會立刻變小,但會停止成長並重複利用空間。' });

    return card;

  function loadStorage(){
    if (!S.cards.storage || ST.loading) return Promise.resolve();
    ST.loading = true;
    return Promise.all([TR.api('storageUsage', {}), TR.api('dbStorage', {})]).then(function(arr){
      ST.loading = false;
      var m = arr[0], d = arr[1];
      if (m && m.ok) { ST.media = m; ST.mediaErr = null; } else ST.mediaErr = m;
      if (d && d.ok) { ST.db = d; ST.dbErr = null; } else ST.dbErr = d;
      ST.loadedAt = Date.now();
      guard(S.cards.storage, renderStorage);
    });
  }
  function renderStorage(){
    var card = S.cards.storage; if (!card) return;
    var sig;
    try { sig = JSON.stringify([ST.media, ST.mediaErr, ST.db, ST.dbErr]); } catch (e) { sig = null; }
    if (sig != null && sig === ST.sig && card.body.firstChild) return;
    ST.sig = sig;
    card.body.textContent = '';
    card.body.appendChild(renderMedia());
    card.body.appendChild(renderDb());
  }
  function renderMedia(){
    var box = h('div', { class: 'sys-sub' }, h('h3', { class: 'sys-sub-title', text: '回報的圖片與影片' }));
    if (!ST.media) {
      box.appendChild(ST.mediaErr ? errState('暫時讀不到媒體用量', ST.mediaErr, loadStorage) : TR.ui.skeleton({ lines: 2 }));
      return box;
    }
    var tot = 0, told = 0, oldN = 0;
    var lines = h('div', { class: 'sys-lines' });
    (ST.media.buckets || []).forEach(function(b){
      tot += num(b.bytes); told += num(b.old_bytes); oldN += num(b.old_files);
      var name = b.bucket === 'report-media' ? '影片' : '圖片';
      lines.appendChild(h('div', { text: name + ':' + TR.fmt.bytes(b.bytes) + '・' + fmtN(b.files) + ' 個檔・' + fmtN(b.old_files) + ' 個超過 45 天' }));
    });
    box.appendChild(h('div', { class: 'sys-big' }, h('span', { class: 'stat-value', text: TR.fmt.bytes(tot) }), h('span', { class: 'muted', text: '合計' + (oldN > 0 ? ',可清 ' + TR.fmt.bytes(told) : '') })));
    box.appendChild(lines);
    if (oldN > 0) {
      var btn = TR.ui.button({
        label: '清理 45 天前的媒體(' + fmtN(oldN) + ' 個・' + TR.fmt.bytes(told) + ')',

(function(){
  'use strict';
  var h = TR.h;

  var PLANS_L = ['月繳','季繳','年繳','測試'];

  var MONTH_OPTS = [1, 2, 3, 6, 12];

  // Local fallbacks, identical to the shared metrics definitions; used only if the shared module is absent.
  var LOCAL = {
    PLAN_DIV: { '月繳':1, '季繳':3, '年繳':12 },
    PLAN_MONTHS: { '月繳':1, '季繳':3, '年繳':12, '測試':1 },
    status: function(r){
      if (!r.active) return { cat:'expired', disabled:true, label:'停用', tone:'neutral' };
      var dl = TR.fmt.daysLeft(r.expires_at);
      if (dl < 0) return { cat:'expired', disabled:false, label:'已過期', tone:'danger' };
      if (dl <= 7) return { cat:'soon', disabled:false, label:'剩 ' + dl + ' 天', tone:'warn' };
      return { cat:'active', disabled:false, label:'有效', tone:'ok' };
    },
    isActive: function(r){ var c = mf('status')(r).cat; return c === 'active' || c === 'soon'; },
    isRenewalDue: function(r){
      var st = mf('status')(r);
      return st.cat === 'soon' || (!!r.active && !st.disabled && st.cat === 'expired' && TR.fmt.daysLeft(r.expires_at) >= -14);
    },
    driverCounts: function(rows){
      var c = { all: rows.length, active: 0, renew: 0, off: 0 };
      rows.forEach(function(r){
        if (mf('isActive')(r)) c.active++;
        if (mf('isRenewalDue')(r)) c.renew++;
        if (mf('status')(r).cat === 'expired') c.off++;
      });
      return c;
    },
    activity: function(r){
      if (!r.last_seen_at) return null;
      var now = Date.now(), seen = new Date(r.last_seen_at).getTime();
      if (now - seen > 20 * 60000) return { k:'off', label:'離線', tone:'neutral' };
      var acc = r.last_accept_at ? new Date(r.last_accept_at).getTime() : 0;
      if (acc && now - acc <= 45 * 60000) return { k:'busy', label:'接單中', tone:'ok' };
      return { k:'idle', label:'等待中', tone:'info' };
    },
    acceptsToday: function(r){
      var td = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
      return r.today_accepts_date === td ? (r.today_accepts || 0) : null;
    },
    monthlyRevenue: function(rows){
      var div = cst('PLAN_DIV');
      var rev = { '月繳':0, '季繳':0, '年繳':0, '測試':0 };
      rows.forEach(function(r){
        if (mf('status')(r).cat === 'expired') return;
        var p = Object.prototype.hasOwnProperty.call(rev, r.plan) ? r.plan : '測試';
        rev[p] += (r.price || 0);

            detail: res.warning ? String(res.warning) : null
          });
          reload();
          return true;
        });
      }
    });

  function rename(r){
    var old = r.driver_name == null ? '' : String(r.driver_name);
    return TR.dialog.form({
      title: '改名:' + who(r),
      level: 'A',
      fields: [{ id: 'nm', label: '司機名字', type: 'text', value: old, placeholder: '例:阿凱', maxLength: 60 }],

          undoToast('已改名為「' + (nm || '—') + '」', '已改回「' + (old.trim() || '—') + '」', function(){
            return TR.api('setName', { key: r.key, driver_name: old.trim() });
          });
          reload();
          return true;
        });
      }
    });

  function changePlan(r){
    var curPlan = PLANS_L.indexOf(r.plan) >= 0 ? r.plan : '月繳';
    var startPrice = curPlan === '測試' ? '' : (r.price || lsGet('tr_price_' + curPlan) || '');
    return TR.dialog.form({
      title: '改方案:' + who(r),
      level: 'B',
      submitText: '下一步',
      fields: [
        { id: 'plan', label: '方案', type: 'select', options: PLANS_L, value: curPlan },
        { id: 'price', label: '每期收費(NT$)', type: 'number', value: startPrice, placeholder: '例 600', min: 1, disabled: curPlan === '測試', hint: '測試方案不收費' }
      ],
      onChange: function(id, vals, ctl){
        if (id !== 'plan') return;
        if (vals.plan === '測試') { ctl.setValue('price', ''); ctl.setDisabled('price', true); }
        else { ctl.setDisabled('price', false); ctl.setValue('price', lsGet('tr_price_' + vals.plan) || ''); }
      },
      validate: function(v){
        if (v.plan === '測試') return null;
        var p = parseInt(v.price, 10) || 0;
        if (p <= 0) return '每期收費要大於 0';
        return null;
      },
      review: function(v){
        var price = v.plan === '測試' ? 0 : (parseInt(v.price, 10) || 0);
        return {
          title: '確認變更「' + who(r) + '」的方案',
          rows: [
            { label: '方案', from: planText(r.plan, r.price), to: planText(v.plan, price) },
            { label: '每月營收', from: TR.fmt.money(monthlyOf(r.plan, r.price), 'NT'), to: TR.fmt.money(monthlyOf(v.plan, price), 'NT') }
          ]
        };
      },
      onSubmit: function(v, ctl){
        var plan = v.plan, price = 0;
        if (plan !== '測試') { price = parseInt(v.price, 10) || 0; lsSet('tr_price_' + plan, String(price)); }
        return TR.api('setPlan', { key: r.key, plan: plan, price: price }).then(function(res){
          if (!res.ok) { var e = TR.err(res); ctl.setError(e.text, e.tech); return false; }
          TR.toast({ type: 'ok', text: '「' + who(r) + '」已改為 ' + planText(plan, price) });
          reload();
          return true;
        });
      }
    });
  }

  /* ---------- create drawer ---------- */
  function openCreate(){
    if (!TR.can('write')) return;
    var st = {};
    TR.drawer({
      title: '新增司機',
      render: function(body, dctl){ st.body = body; st.dctl = dctl; },
      footer: function(foot){ st.foot = foot; showCreateForm(st); }
    });
  }

  function labeled(label, control, hint){
    var lab = h('label', { class: 'field-label', for: control.id, text: label });
    var wrap = h('div', { class: 'field' }, lab, control);
    var hintEl = null;
    if (hint != null) { hintEl = h('p', { class: 'field-hint', text: hint }); wrap.appendChild(hintEl); }
    return { wrap: wrap, label: lab, hint: hintEl };
  }

  function showCreateForm(st){
    var body = st.body, foot = st.foot, dctl = st.dctl;
    body.textContent = ''; foot.textContent = '';
    dctl.setDirty(false);
    var priceTouched = false;

    var name = h('input', { class: 'input', id: fid(), type: 'text', placeholder: '例:阿凱', attrs: { autocomplete: 'off', maxlength: '60' } });
    var plan = h('select', { class: 'select', id: fid() });
    PLANS_L.forEach(function(p){ plan.appendChild(h('option', { value: p, text: p })); });
    plan.value = '月繳';
    var price = h('input', { class: 'input num', id: fid(), type: 'number', placeholder: '例 600', attrs: { min: '1', inputmode: 'numeric' } });
    var months = h('select', { class: 'select', id: fid() });
    MONTH_OPTS.forEach(function(m){ months.appendChild(h('option', { value: String(m), text: m + ' 個月' })); });
    var days = h('input', { class: 'input num', id: fid(), type: 'number', placeholder: '例 7', attrs: { min: '1', max: '365', inputmode: 'numeric' } });

    var fName = labeled('司機名字', name);
    var fPlan = labeled('方案', plan);
    var fPrice = labeled('每期收費(NT$)', price, '會記住這個方案上次填的價格');
    var fMonths = labeled('月數', months);
    var fDays = labeled('贈送天數(選填)', days, '');

    var errBox = h('div', { class: 'dialog-errors', attrs: { role: 'alert' } });
    function setErr(text, tech){
      errBox.textContent = '';
      if (text) errBox.appendChild(h('p', { class: 'field-error', text: text }));
      if (text && tech) errBox.appendChild(TR.ui.tech(tech));
    }

    var form = h('div', { class: 'drv-form' },
      fName.wrap,
      h('div', { class: 'drv-grid' }, fPlan.wrap, fPrice.wrap, fMonths.wrap),
      fDays.wrap,
      errBox);
    body.appendChild(form);

    function syncMonths(){
      var trialByDays = plan.value === '測試' && days.value.trim() !== '';
      months.disabled = trialByDays;
    }
    function syncPlan(){
      var p = plan.value;
      months.value = String(cst('PLAN_MONTHS')[p] || 1);
      if (MONTH_OPTS.indexOf(Number(months.value)) < 0) months.value = '1';
      if (p === '測試') {
        price.value = ''; price.disabled = true;
        fPrice.hint.textContent = '測試方案不收費';
        fDays.label.textContent = '體驗天數(選填,填了就以天數計)';
        fDays.hint.textContent = '不填就用上面的月數';
      } else {
        price.disabled = false;
        price.value = lsGet('tr_price_' + p) || '';
        priceTouched = false;
        fPrice.hint.textContent = '會記住這個方案上次填的價格';
        fDays.label.textContent = '贈送天數(選填)';
        fDays.hint.textContent = '加在方案月數之後,價格照算';
      }
      syncMonths();
    }
    function updDirty(){ dctl.setDirty(!!(name.value.trim() || days.value.trim() || priceTouched)); }
    plan.addEventListener('change', function(){ syncPlan(); updDirty(); });
    days.addEventListener('input', function(){ syncMonths(); updDirty(); });
    name.addEventListener('input', updDirty);
    price.addEventListener('input', function(){ priceTouched = true; updDirty(); });
    syncPlan();

    var inputs = [name, plan, price, months, days];
    var cancelBtn = null;
    function setLocked(b){
      inputs.forEach(function(x){ x.disabled = b; });
      if (cancelBtn) cancelBtn.disabled = b;
      if (!b) { price.disabled = plan.value === '測試'; syncMonths(); }
    }

    function submit(){
      setErr('');
      var nm = name.value.trim();
      if (!nm) { setErr('請填司機名字'); name.focus(); return null; }
      var p = plan.value;
      var dStr = days.value.trim();
      var d = 0;
      if (dStr !== '') {
        d = Number(dStr);
        if (!Number.isInteger(d) || d < 1 || d > 365) { setErr('天數要是 1 到 365 的整數'); days.focus(); return null; }
      }
      var m = parseInt(months.value, 10) || 1;
      var payload, pr = 0;
      if (p === '測試') {
        payload = d > 0 ? { driver_name: nm, plan: '測試', days: d } : { driver_name: nm, plan: '測試', months: m };
      } else {
        pr = parseInt(price.value, 10) || 0;
        if (pr <= 0) { setErr('請填每期收費(要大於 0)'); price.focus(); return null; }
        payload = { driver_name: nm, plan: p, price: pr, months: m };
        if (d > 0) payload.days = d;
      }
      if (p !== '測試' && d > 0) {
        return TR.dialog.confirm({
          title: '建立付費授權「' + nm + '」?',
          body: '填了天數,但方案不是測試:這會建立付費授權並記一筆收入。只想給體驗,請把方案改成測試。',
          rows: [
            { label: '方案', to: p },
            { label: '每期收費', to: TR.fmt.money(pr, 'NT') },
            { label: '期間', to: m + ' 個月 + 贈送 ' + d + ' 天' },
            { label: '帳務', to: '會記一筆收入' }
          ],
          level: 'B',
          confirmText: '建立付費授權'
        }).then(function(ok){ if (ok) return send(); });
      }
      return send();

      function send(){
      if (p !== '測試') lsSet('tr_price_' + p, String(pr));
      setLocked(true);
      dctl.setBusy(true);
      return TR.api('create', payload).then(function(res){
        dctl.setBusy(false);
        setLocked(false);
        if (res.error || !res.row) {
          var e = TR.err(res);
          setErr('新增失敗:' + e.text, e.tech);
          return;
        }
        reload();
        showCreateResult(st, res, { plan: p, price: pr, days: d, months: m, name: nm });
      });
      }
    }

    var submitBtn = TR.ui.button({ label: '產生金鑰', variant: 'primary', onClick: submit });
    [name, price, days].forEach(function(x){
      x.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); submitBtn.click(); } });
    });
    cancelBtn = TR.ui.button({ label: '取消', variant: 'secondary', onClick: function(){
      var hasDraft = !!(name.value.trim() || days.value.trim() || priceTouched);
      if (!hasDraft) { dctl.close(); return; }
      TR.dialog.confirm({ title: '放棄未儲存的內容?', body: '剛才輸入的內容不會被儲存。', confirmText: '放棄', cancelText: '繼續編輯', level: 'B' })
        .then(function(ok){ if (ok) dctl.close(); });
    } });
    foot.appendChild(cancelBtn);
    foot.appendChild(submitBtn);
  }

  function showCreateResult(st, res, input){
    var body = st.body, foot = st.foot, dctl = st.dctl;
    var row = res.row;
    body.textContent = ''; foot.textContent = '';
    dctl.setDirty(false);
    var nm = (row.driver_name != null && String(row.driver_name).trim()) || input.name;
    var parts = [nm];
    var plan = row.plan || input.plan;
    if (plan === '測試') {
      if (input.days > 0) parts.push('體驗 ' + (res.bonus_days || input.days) + ' 天');
      else parts.push('測試 ' + input.months + ' 個月');
    } else {
      parts.push(plan + '(' + TR.fmt.money(row.price != null ? row.price : input.price, 'NT') + ')');
      if (res.bonus_days > 0) parts.push('贈送 ' + res.bonus_days + ' 天');
    }
    parts.push('到期 ' + TR.fmt.date(row.expires_at));

    var copyPair = TR.ui.button({ label: '複製名字＋金鑰', icon: 'copy', variant: 'secondary', onClick: function(){
      return TR.copy(((row.driver_name || '') + ' ' + row.key).trim(), '已複製名字與金鑰');
    } });
    var copyMsg = TR.ui.button({ label: '複製給司機的訊息', icon: 'copy', variant: 'primary', onClick: function(){
      var msg = "您的車趟輔助授權金鑰:" + row.key + "\n打開 App 輸入一次即可啟用(會綁定這支手機)\n效期至 " + TR.fmt.date(row.expires_at);
      return TR.copy(msg, '訊息已複製,直接貼給司機');
    } });

    var panel = h('div', { class: 'drv-result', attrs: { role: 'status' } },
      h('div', { class: 'row row-wrap' },
        h('span', { class: 'drv-result-ok', attrs: { 'aria-hidden': 'true' }, text: '✓' }),
        h('h3', { class: 'drv-result-title', text: '已產生金鑰' }),
        res.warning ? TR.ui.badge('帳務紀錄未寫入', 'warn') : null),
      h('p', { class: 'muted num', text: parts.join('・') }),
      h('div', { class: 'drv-keybig mono', text: row.key }),
      h('div', { class: 'drv-result-actions' }, copyPair, copyMsg),
      res.warning ? TR.ui.tech(String(res.warning)) : null);
    body.appendChild(panel);

    foot.appendChild(TR.ui.button({ label: '再新增一位', variant: 'secondary', icon: 'plus', onClick: function(){ showCreateForm(st); setTimeout(function(){ var f = body.querySelector('input'); if (f) f.focus(); }, 0); } }));
    foot.appendChild(TR.ui.button({ label: '完成', variant: 'primary', onClick: function(){ dctl.close(); } }));
    setTimeout(function(){ try { copyMsg.focus(); } catch (e) {} }, 0);
  }

  /* ---------- broadcast ---------- */
  function broadcastErr(res){
    var e = TR.err(res);
    if (res && res.error === 'need_migration_broadcasts') return { text: '公告功能尚未啟用,請聯絡工程人員', tech: e.tech };
    if (res && res.error === 'empty') return { text: '標題或內文至少填一個', tech: e.tech };
    return e;
  }
  function stopBroadcast(){
    return TR.dialog.confirm({
      title: '停止目前公告?',
      body: '停止後司機不會再收到這則公告,已顯示的橫幅由司機自己關閉。',
      level: 'B',
      confirmText: '停止公告',
      onConfirm: function(ctl){
        return TR.api('stopBroadcast', {}).then(function(res){
          if (!res.ok) { var e = broadcastErr(res); ctl.setError(e.text, e.tech); return false; }
          TR.toast({ type: 'ok', text: '已停止目前公告' });
          return true;
        });
      }
    });
  }
  function openBroadcast(){
    if (!TR.can('write')) return;
    var urgentNote = null;
    TR.dialog.form({
      title: '發公告',
      level: 'B',
      submitText: '下一步',
      fields: [
        { id: 'title', label: '標題', type: 'text', placeholder: '例:系統維護通知', maxLength: 60, hint: '最多 60 字' },
        { id: 'body', label: '內文', type: 'textarea', rows: 5, maxLength: 500, placeholder: '給全體司機看的白話內容(最多 500 字)' },
        { id: 'level', label: '等級', type: 'segmented', value: 'normal', options: [{ value: 'normal', label: '一般' }, { value: 'urgent', label: '緊急' }],
          hint: '一般:司機首頁出現橫幅。緊急:發系統通知並跳出視窗。' },
        { id: 'warn', type: 'custom', render: function(wrap){
          urgentNote = h('p', { class: 'dialog-note', hidden: true, text: '⚠ 緊急公告會對全體司機發出通知並跳出視窗,只用在重要事項。' });
          wrap.appendChild(urgentNote);
          var dlg = wrap.closest ? wrap.closest('.dialog') : null;
          var dfoot = dlg ? dlg.querySelector('.dialog-foot') : null;
          if (dfoot) {
            var stopBtn = TR.ui.button({ label: '停止目前公告', variant: 'ghost', className: 'dialog-foot-extra', onClick: stopBroadcast });
            dfoot.insertBefore(stopBtn, dfoot.firstChild);
          }
        } }
      ],
      onChange: function(id, vals){
        if (id === 'level' && urgentNote) urgentNote.hidden = vals.level !== 'urgent';
      },
      validate: function(v){
        if (!String(v.title || '').trim() && !String(v.body || '').trim()) return '標題或內文至少填一個';
        return null;
      },
      review: function(v){
        var t = String(v.title || '').trim(), b = String(v.body || '').trim();
        var urgent = v.level === 'urgent';
        return {
          title: urgent ? '確認發出緊急公告' : '確認發出公告',
          rows: [
            { label: '等級', to: urgent ? '緊急(系統通知+跳出視窗)' : '一般(首頁橫幅)' },
            { label: '標題', to: t || '(無標題)' },
            { label: '內文', to: b ? (b.length > 80 ? b.slice(0, 80) + '…' : b) : '(無內文)' }
          ],
          note: urgent ? '緊急公告會對全體司機發出通知,請確認內容重要且正確。' : null
        };
      },
      onSubmit: function(v, ctl){
        var level = v.level === 'urgent' ? 'urgent' : 'normal';
        return TR.api('publishBroadcast', { title: String(v.title || '').trim(), body: String(v.body || '').trim(), level: level }).then(function(res){
          if (!res.ok) { var e = broadcastErr(res); ctl.setError(e.text, e.tech); return false; }
          TR.toast({ type: 'ok', text: level === 'urgent' ? '緊急公告已發出' : '公告已發出' });
          return true;
        });
      }
    });
  }

  TR.drivers = { renew: renew, openCreate: openCreate, openBroadcast: openBroadcast };

  /* ---------- page ---------- */
  var FILTERS = ['all', 'active', 'renew', 'off'];
  var state = { section: null, mounted: false, stale: false, filter: 'all', query: '', seg: null, search: null, table: null, emptyTitle: null, body: null, view: '' };

  function normF(f){

    var toggle = h('button', { type: 'button', class: 'btn btn-ghost btn-sm btn-icon rep-toggle', attrs: { 'aria-expanded': isOpen ? 'true' : 'false', 'aria-controls': el._bodyId, 'aria-label': isOpen ? '收合詳細內容' : '展開詳細內容' } }, TR.icon('chevron'));
    head.appendChild(h('div', { class: 'rep-side' }, h('span', { class: 'rep-meta hide-mobile', text: metaText }), toggle));

    head.addEventListener('click', function(ev){
      var t = ev.target;
      if (t && t.closest && t.closest('.rep-check, .rep-id')) return;
      try {
        var sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.anchorNode && head.contains(sel.anchorNode)) return;
      } catch (e) {}
      toggleCard(el);
    });
    return head;
  }

  function paintCardState(el){
    var r = el._row;
    var id = String(r.id);
    var isOpen = expanded.has(id);
    el.classList.toggle('is-resolved', !!r.resolved);
    el.classList.toggle('is-open', isOpen);
    var tg = el.querySelector('.rep-toggle');
    if (tg) { tg.setAttribute('aria-expanded', isOpen ? 'true' : 'false'); tg.setAttribute('aria-label', isOpen ? '收合詳細內容' : '展開詳細內容'); }
    var chk = el.querySelector('.rep-check input');
    if (chk) chk.checked = selected.has(id);
  }

  function renderCard(r){
    uid += 1;
    var el = h('article', { class: 'card rep-card' });
    el._bodyId = 'rep-body-' + uid;
    el._row = r;
    el._sig = sigOf(r);
    el._body = h('div', { class: 'rep-body', id: el._bodyId, hidden: true });
    el.appendChild(buildHead(r, el));
    el.appendChild(el._body);
    if (expanded.has(String(r.id))) fillBody(el);
    paintCardState(el);
    return el;
  }

  function updateCard(el, r){
    var sig = sigOf(r);
    el._row = r;
    if (sig !== el._sig) {
      el._sig = sig;
      el.replaceChild(buildHead(r, el), el.firstChild);
      if (expanded.has(String(r.id))) fillBody(el);
    }
    paintCardState(el);
    return el;
  }

  function toggleCard(el, force){
    var r = el._row;
    var id = String(r.id);
    var open = force != null ? !!force : !expanded.has(id);
    if (open) {
      expanded.add(id);
      if (el._body.hidden || !el._body.firstChild) fillBody(el);
    } else {
      expanded.delete(id);
      el._body.hidden = true;
      el._body.textContent = '';
      el._reply = null;
    }
    paintCardState(el);
  }

  function fillBody(el){
    var r = el._row;
    var id = String(r.id);
    var quick = isQuick(r);
    var body = el._body;
    body.textContent = '';
    el._reply = null;

    var nb = quick ? noteBody(r) : String(r.note || '').trim();
    if (nb) body.appendChild(sec('司機說明', h('p', { class: 'rep-note', text: nb })));

    var imgs = imagesOf(r).map(function(u){ return TR.safeUrl(u); }).filter(Boolean);
    var vid = TR.safeUrl(r.video_url);
    if (imgs.length || vid) {
      var media = [];
      if (imgs.length) {
        media.push(h('div', { class: 'thumbs' }, imgs.map(function(u, i){
          return h('a', { class: 'thumb', href: u, target: '_blank', rel: 'noopener', attrs: { 'aria-label': '在新分頁開啟截圖 ' + (i + 1) } },
            h('img', { src: u, alt: '回報截圖 ' + (i + 1), attrs: { loading: 'lazy', decoding: 'async' } }));
        })));
      }
      if (vid) media.push(h('a', { class: 'link rep-video', href: vid, target: '_blank', rel: 'noopener', text: '觀看影片 ›' }));
      body.appendChild(sec('截圖與影片', media));
    }

    if (quick) {
      var grp = (String(r.parse_snapshot || '').match(/群組=(\S+)/) || [])[1] || '';
      body.appendChild(sec('上下車摘要', [
        h('p', { class: 'rep-summary', text: quickSummaryText(r) }),
        grp ? h('p', { class: 'muted rep-small', text: '群組:' + grp }) : null
      ]));
    }

    var sims = simsFor(r);
    if (sims.length) {
      var simList = h('div', { class: 'list' });
      sims.forEach(function(x){
        var o = x.o;
        var tone = o.resolved ? (o.no_issue ? 'neutral' : 'ok') : 'warn';
        var label = o.resolved ? (o.no_issue ? '沒問題' : '已修復') : '待處理';
        var kind = isQuick(o) ? '快速回報' : (o.report_type || '');
        simList.appendChild(h('button', {
          type: 'button', class: 'rep-sim',
          on: { click: function(){ openReport(o.id); } }
        },
          TR.ui.statusDot(tone, label),
          h('span', { class: 'grow truncate rep-sim-name', text: nameOf(o) + (kind ? '・' + kind : '') }),
          h('span', { class: 'faint num rep-small', text: TR.fmt.date(o.created_at) + '・相似度 ' + Math.round(x.sc * 100) + '%' })));
      });
      var anyRes = sims.some(function(x){ return x.o.resolved; });
      body.appendChild(sec('相似回報', [
        anyRes ? h('p', { class: 'muted rep-small', text: '其中有已修復的,可能是同一個問題。' }) : null,
        simList
      ]));
    }

    if (r.corrected_pickup || r.corrected_dropoff || r.corrected_time) {
      var fixes = [];
      if (r.corrected_pickup) fixes.push(['上車', pickFromSnap(r, '上車'), r.corrected_pickup]);
      if (r.corrected_dropoff) fixes.push(['下車', pickFromSnap(r, '下車'), r.corrected_dropoff]);
      if (r.corrected_time) fixes.push(['時間', pickFromSnap(r, 'time'), r.corrected_time]);
      body.appendChild(sec('司機修正', [
        h('p', { class: 'muted rep-small', text: 'App 抓到的 → 司機說的正確值' }),
        h('div', { class: 'review-rows' }, fixes.map(function(f){
          return h('div', { class: 'review-row' },
            h('div', { class: 'review-label', text: f[0] }),
            h('div', { class: 'review-val' },
              h('span', { class: 'review-from', text: String(f[1]) }),
              h('span', { class: 'review-arrow', attrs: { 'aria-label': '改為' }, text: '→' }),
              h('span', { class: 'review-to', text: String(f[2]) })));
        }))
      ]));
    }

    if (r.parse_snapshot) body.appendChild(sec('App 當下解析', h('pre', { class: 'pre', text: String(r.parse_snapshot) })));
    if (r.raw_dispatch) body.appendChild(sec('派單原文', h('pre', { class: 'pre rep-pre-raw', text: String(r.raw_dispatch) })));

    if (r.report) {
      var dbg = h('details', { class: 'rep-debug' }, h('summary', { text: '完整除錯資訊' }), h('pre', { class: 'pre rep-pre-debug', text: String(r.report) }));
      dbg.open = debugOpen.has(id);
      dbg.addEventListener('toggle', function(){ if (dbg.open) debugOpen.add(id); else debugOpen.delete(id); });
      body.appendChild(dbg);
    }

    if (!quick) {
      var convo = [];
      var msgs = Array.isArray(r.messages) ? r.messages : [];
      if (msgs.length) {
        convo.push(h('div', { class: 'thread' }, msgs.map(function(m){
          var mine = m && m.sender === 'admin';
          return h('div', { class: 'msg ' + (mine ? 'msg-admin' : 'msg-driver') },
            h('span', { class: 'msg-meta', text: (mine ? '管理者' : '司機') + '・' + TR.fmt.rel(m && m.created_at) }),
            String((m && m.body) == null ? '' : m.body));
        })));
      } else if (r.admin_reply) {
        convo.push(h('p', { class: 'rep-current', text: '目前留言:' + r.admin_reply }));
      }
      if (canWrite()) {
        var ta = h('textarea', { class: 'textarea rep-reply', rows: 3, placeholder: '輸入要回覆司機的內容', attrs: { 'aria-label': '回覆「' + nameOf(r) + '」' } });
        ta.value = drafts.get(id) || '';
        ta.addEventListener('input', function(){ if (ta.value) drafts.set(id, ta.value); else drafts.delete(id); });
        el._reply = ta;
        convo.push(h('div', { class: 'rep-templates', attrs: { role: 'group', 'aria-label': '回覆範本' } }, QUICK_REPLIES.map(function(q){
          return TR.ui.button({ label: q.label, size: 'sm', variant: 'secondary', onClick: function(){
            ta.value = q.text;
            drafts.set(id, q.text);
            ta.focus();
          } });
        })));
        convo.push(ta);
        var replyRow = h('div', { class: 'rep-reply-actions' },
          TR.ui.button({ label: '送出回覆', size: 'sm', variant: 'primary', onClick: function(){ sendReply(el); } }));
        if (r.admin_reply) replyRow.appendChild(TR.ui.button({ label: '收回留言', size: 'sm', variant: 'ghost', onClick: function(){ retractReply(el); } }));
        replyRow.appendChild(h('span', { class: 'faint rep-small', text: '最多 1,000 字' }));
        convo.push(replyRow);
      }
      if (convo.length) body.appendChild(sec('對話', convo));
    }

    var actions = h('div', { class: 'rep-actions' });
    if (canWrite()) {
      actions.appendChild(TR.ui.button({
        label: r.resolved ? '移回待處理' : '標記已修復', size: 'sm', variant: r.resolved ? 'secondary' : 'primary',
        icon: r.resolved ? null : 'check',
        onClick: function(){ var cur = el._row; return setResolved(cur, !cur.resolved, false); }
      }));
      if (!r.resolved) actions.appendChild(TR.ui.button({ label: '沒問題', size: 'sm', variant: 'secondary', onClick: function(){ markNoIssue(el._row); } }));
      if (!quick) actions.appendChild(TR.ui.button({ label: '回覆', size: 'sm', variant: 'secondary', onClick: function(){
        if (el._reply) { try { el._reply.scrollIntoView({ block: 'center' }); } catch (e) {} el._reply.focus(); }
      } }));
    }
    actions.appendChild(TR.ui.button({ label: '複製給 Claude', size: 'sm', variant: 'secondary', icon: 'copy', onClick: function(){ return copyClaude([el._row]); } }));
    actions.appendChild(TR.ui.menuButton(function(){
      return [
        { label: '複製完整報告', onClick: function(){ TR.copy(redactKeys(el._row.report || ''), '報告已複製'); } },
        { label: '編輯內容', hidden: !canWrite(), onClick: function(){ editReport(el._row); } },
        { label: '刪除', danger: true, hidden: !canWrite(), onClick: function(){ deleteReport(el._row); } }
      ];
    }, { label: '更多動作' }));
    body.appendChild(actions);

    body.hidden = false;
  }

  // ---- writes ----
  function setResolved(r, target, isUndo){
    var id = String(r.id);
    return TR.api('setReportResolved', { id: r.id, resolved: !!target }).then(function(res){
      if (!okRes(res)) { errToast(res, isUndo ? '復原失敗:' : (target ? '標記失敗:' : '移回失敗:')); return; }
      if (target) selected.delete(id);
      if (isUndo) TR.toast({ type: 'ok', text: '已復原' });
      else TR.toast({
        type: 'ok',
        text: target ? '已標記已修復(司機 App 會看到打勾)' : '已移回待處理',
        action: { label: '復原', onClick: function(){ return setResolved(r, !target, true); } }
      });
      updateBatch();
      reload();
    });
  }

  function markNoIssue(r){
    var id = String(r.id);
    TR.dialog.confirm({
      title: '把這筆回報標為沒問題?',
      body: '結案但不計入司機的修復筆數,司機會收到一則說明。',
      confirmText: '標為沒問題',
      level: 'B',
      onConfirm: function(ctl){
        return TR.api('setReportNoIssue', { id: r.id }).then(function(res){
          if (!okRes(res)) { var e = TR.err(res); ctl.setError(e.text, e.tech); return false; }
          selected.delete(id);
          updateBatch();
          TR.toast({ type: 'ok', text: '已結案:沒問題' });
          reload();
          return true;
        });
      }
    });
  }

  function batchResolve(){
    // 只送未結案的:已結案(含「沒問題」)再送一次會重設結案時間,司機會再收到一次「已修復」通知
    var open = {};
    (rows || []).forEach(function(r){ if (r && !r.resolved) open[String(r.id)] = true; });
    var ids = Array.from(selected).filter(function(id){ return open[id]; });
    if (!ids.length) { TR.toast({ type: 'info', text: '先勾選要標記的未修復回報' }); return; }
    if (ids.length > 500) { TR.toast({ type: 'err', text: '一次最多 500 筆,請分批處理' }); return; }
    TR.dialog.confirm({
      title: '把 ' + TR.fmt.num(ids.length) + ' 筆標記為已修復?',
      body: '司機 App 會看到打勾,並計入回報獎勵筆數。',
      confirmText: '標記已修復',
      level: 'C',
      onConfirm: function(ctl){
        return TR.api('batchSetReportsResolved', { ids: ids }).then(function(res){
          if (!okRes(res)) { var e = TR.err(res); ctl.setError(e.text, e.tech); return false; }
          TR.toast({ type: 'ok', text: '已標記 ' + TR.fmt.num(res.n || ids.length) + ' 筆為已修復' });
          selected.clear();
          syncChecks();
          updateBatch();
          reload();
          return true;
        });
      }
    });
  }

  function sendReply(el){
    var r = el._row;
    var id = String(r.id);
    var ta = el._reply;
    var txt = ((ta && ta.value) || '').trim();
    if (!txt) { TR.toast({ type: 'info', text: '先打字或點一個範本' }); if (ta) ta.focus(); return; }
    if (txt.length > 1000) { TR.toast({ type: 'err', text: '回覆最多 1,000 字,目前 ' + TR.fmt.num(txt.length) + ' 字' }); return; }
    TR.dialog.confirm({
      title: '送出回覆給「' + nameOf(r) + '」?',
      body: h('div', { class: 'stack-2' },
        h('pre', { class: 'pre rep-pre-reply', text: txt }),
        h('p', { class: 'dialog-desc', text: '司機下次開 App 會收到通知。' })),
      confirmText: '送出',
      level: 'B',
      onConfirm: function(ctl){
        return TR.api('replyReport', { id: r.id, reply: txt }).then(function(res){
          if (!okRes(res)) { var e = TR.err(res); ctl.setError(e.text, e.tech); return false; }
          drafts.delete(id);
          if (el._reply) el._reply.value = '';
          TR.toast({ type: 'ok', text: '回覆已送出' });
          reload();
          return true;
        });
      }
    });
  }

  function retractReply(el){
    var r = el._row;
    TR.dialog.confirm({
      title: '收回留言?',
      body: '收回後司機就看不到這則留言。',
      confirmText: '收回',
      level: 'B',
      onConfirm: function(ctl){
        return TR.api('replyReport', { id: r.id, reply: '' }).then(function(res){
          if (!okRes(res)) { var e = TR.err(res); ctl.setError(e.text, e.tech); return false; }
          TR.toast({ type: 'ok', text: '已收回留言' });
          reload();
          return true;
        });
      }
    });
  }

  function editReport(r){
    var oldNote = r.note == null ? '' : String(r.note);
    var oldRaw = r.raw_dispatch || '';
    TR.dialog.form({
      title: '編輯回報內容',
      fields: [
        { id: 'note', label: '司機描述', type: 'textarea', value: oldNote, rows: 4 },
        { id: 'raw', label: '派單原文', type: 'textarea', value: oldRaw, rows: 6, hint: '自動附上的原文如果是錯的那張,可以貼上正確的。' }
      ],
      submitText: '儲存',
      level: 'A',
      onSubmit: function(v, ctl){
        var patch = { id: r.id };
        var noteChanged = String(v.note) !== oldNote;
        var rawChanged = String(v.raw) !== String(oldRaw);
        if (noteChanged) patch.note = String(v.note);
        if (rawChanged) patch.raw_dispatch = String(v.raw);
        if (!noteChanged && !rawChanged) { TR.toast({ type: 'info', text: '內容沒有變更' }); return true; }
        return TR.api('editReport', patch).then(function(res){
          if (!okRes(res)) { var e = TR.err(res); ctl.setError(e.text, e.tech); return false; }
          TR.toast({
            type: 'ok', text: '已更新回報內容',
            action: { label: '復原', onClick: function(){
              var undo = { id: r.id };
              if (noteChanged) undo.note = oldNote;
              if (rawChanged) undo.raw_dispatch = oldRaw;
              return TR.api('editReport', undo).then(function(r2){
                if (!okRes(r2)) errToast(r2, '復原失敗:');
                else TR.toast({ type: 'ok', text: '已復原' });
                reload();
              });
            } }
          });
          reload();
          return true;
        });
      }
    });
  }

  function deleteReport(r){
    var id = String(r.id);
    TR.dialog.confirm({
      title: '刪除這筆回報?',
      body: '無法復原,司機端也會消失。',
      confirmText: '刪除',
      level: 'C',
      onConfirm: function(ctl){
        return TR.api('deleteReport', { id: r.id }).then(function(res){
          if (!okRes(res)) { var e = TR.err(res); ctl.setError(e.text, e.tech); return false; }
          selected.delete(id); expanded.delete(id); drafts.delete(id); debugOpen.delete(id);
          updateBatch();
          TR.toast({ type: 'ok', text: '已刪除' });
          reload();
          return true;
        });
      }
    });
  }

  function copyClaude(list){
    var arr = (list || []).filter(Boolean);
    if (!arr.length) { TR.toast({ type: 'info', text: '沒有可複製的回報' }); return Promise.resolve(false); }
    var txt = arr.map(claudeBlock).join("\n\n----\n\n");
    return TR.copy(txt, '已複製 ' + arr.length + ' 筆給 Claude');
  }

  // ---- batch bar ----
  function cardEls(){ return ui.list ? Array.prototype.slice.call(ui.list.children) : []; }
  function syncChecks(){
    cardEls().forEach(function(el){
      var chk = el.querySelector('.rep-check input');
      if (chk) chk.checked = selected.has(el.dataset.trKey);
    });
  }
  function updateBatch(){
    if (!ui.batch) return;
    var n = selected.size;
    ui.batch.hidden = n === 0;
    ui.batchCount.textContent = '已選 ' + TR.fmt.num(n) + ' 筆';
    if (ui.batchResolve) {
      var openSel = (rows || []).filter(function(r){ return selected.has(String(r.id)) && !r.resolved; }).length;
      ui.batchResolve.hidden = openSel === 0;
    }
    TR.ui.syncBatch();
  }
  function selectAllOpen(){
    (S.lastList || []).forEach(function(r){ if (r && !r.resolved) selected.add(String(r.id)); });
    syncChecks();
    updateBatch();
  }

  // ---- deep link ----
  function openReport(id){
    var sid = String(id);
    if (sid === S.openId) { S.openDone = ''; S.clearedFor = ''; handleOpen(); }
    else TR.router.setParams({ open: sid });
  }
  function handleOpen(){
    if (!S.openId || S.openDone === S.openId || !Array.isArray(rows)) return;
    var target = null;
    for (var i = 0; i < rows.length; i++) { if (String(rows[i].id) === S.openId) { target = rows[i]; break; } }
    if (!target) { S.openDone = S.openId; return; }
    var el = null;
    cardEls().forEach(function(c){ if (c.dataset.trKey === S.openId) el = c; });
    if (!el) {
      if (S.clearedFor === S.openId) { S.openDone = S.openId; return; }
      S.clearedFor = S.openId;
      TR.router.setParams({ s: 'all', k: '', t: '', q: '' });
      return;
    }
    S.openDone = S.openId;
    toggleCard(el, true);
    setTimeout(function(){ try { el.scrollIntoView({ block: 'start' }); } catch (e) {} }, 0);
  }

  // ---- render ----
  function renderChips(types){
    var sig = S.t + '|' + JSON.stringify(types);
    if (sig === ui.chipsSig) return;
    ui.chipsSig = sig;
    var ae = document.activeElement;
    var focusVal = (ae && ae.parentNode === ui.chips) ? ae.getAttribute('data-type') : null;
    ui.chips.textContent = '';
    if (!types.length) return;
    function chip(value, label, count){
      var on = S.t === value;
      var b = h('button', { type: 'button', class: 'chip', attrs: { 'aria-pressed': on ? 'true' : 'false', 'data-type': value } },
        h('span', { text: label }),
        count != null ? h('span', { class: 'count', text: TR.fmt.num(count) }) : null);
      b.addEventListener('click', function(){ TR.router.setParams({ t: value }); });
      ui.chips.appendChild(b);
      if (focusVal != null && focusVal === value) setTimeout(function(){ try { b.focus(); } catch (e) {} }, 0);
    }
    chip('', '全部類型', null);
    types.forEach(function(t){ chip(t[0], t[0], t[1]); });
  }

  function renderStatus(st){
    ui.status.textContent = '';
    if (!Array.isArray(rows)) {
      if (st.error && !st.loading) {
        var retry = TR.ui.button({ label: '重新讀取', variant: 'secondary', icon: 'refresh', onClick: function(){ return reload(); } });
        ui.status.appendChild(h('div', { class: 'card' },
          TR.ui.emptyState({ title: '暫時無法讀取回報', text: st.error.text, action: retry }),
          h('div', { class: 'card-body' }, TR.ui.tech(st.error.tech))));
      } else {
        ui.status.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-body' }, TR.ui.skeleton({ variant: 'table', lines: 5 }))));
      }
      ui.status.hidden = false;
      return false;
    }
    if (st.error) {
      ui.status.appendChild(h('div', { class: 'rep-notice', attrs: { role: 'status' } },
        h('span', { text: '暫時無法更新,下面是上次讀到的內容' }), TR.ui.tech(st.error.tech)));
      ui.status.hidden = false;
    } else {
      ui.status.hidden = true;
    }
    return true;
  }

  function render(){
    if (!S.mounted) return;
    S.stale = false;
    var st = TR.data.get('reports');
    if (Array.isArray(st.value)) rows = st.value;
    var ready = renderStatus(st);
    ui.filters.hidden = !ready;
    if (!ready) { ui.list.textContent = ''; ui.empty.hidden = true; TR.page.updateHeader('reports'); return; }

    var all = rows;
    var kindRows = all.filter(matchKind);
