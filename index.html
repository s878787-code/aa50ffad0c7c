            var nm = String(v.name || '').trim();
            if (!nm) { ctl.setError('先填名稱再查座標'); return; }
            ctl.setError('');
            return TR.api('suggestCoords', { q: nm, city: String(v.city || '').trim() }).then(function(r){
              if (r && r.ok) {
                ctl.setValue('coord', r.lat + ', ' + r.lng);
                TR.toast({ type: 'ok', text: '找到:' + String(r.display || '').slice(0, 60) });
              } else if (!silentErr(r)) {
                TR.toast({ type: 'err', text: '查不到,請用 Google 地圖複製座標', detail: r && r.error && r.error !== 'not_found' ? TR.err(r).tech : null });
              }
            });
          } });
          if (coordEl && coordEl.parentNode) coordEl.parentNode.appendChild(btn);
          else wrapEl.appendChild(btn);
          wrapEl.appendChild(h('p', { class: 'field-hint', text: '查座標可能產生 Google 費用' }));
        } },
        { id: 'addr', label: '完整地址', type: 'text', value: isEdit ? (p.address || '') : '', placeholder: '可留空' },
        { id: 'verified', label: '已驗證(打勾後 App 才會使用)', type: 'checkbox', value: isEdit ? !!p.verified : false }
      ],
      validate: function(v){
        if (!parseCoord(v.coord)) return '座標格式不對,請貼上像「25.033, 121.565」的座標';
        return null;
      },
      onSubmit: function(v, ctl){
        var name = String(v.name || '').trim();
        var c = parseCoord(v.coord);
        var payload = { name: name, aliases: v.alias, lat: c.lat, lng: c.lng,
          city: String(v.city || '').trim(), address: String(v.addr || '').trim(), verified: !!v.verified };
        if (isEdit) { payload.id = p.id; payload.note = p.note; payload.source = p.source; }
        return TR.api(isEdit ? 'editPlace' : 'addPlace', payload).then(function(res){
          if (res && res.ok) {
            TR.toast({ type: 'ok', text: (isEdit ? '已儲存「' : '已新增「') + name + '」' });
            afterPlaceWrite(onSaved);
            return true;
          }
          if (silentErr(res)) return false;
          if (res && res.error === 'dup_alias' && res.conflict) {
            if (isEdit) {
              ctl.setError('名稱或別名和「' + (res.conflict.name || '') + '」重複,尚未儲存', TR.err(res).tech + ' · ' + (res.conflict.keys || []).join('、'));
              return false;
            }
            return askMerge(res.conflict, name, v.alias, ctl, onSaved);
          }
          var e = placeErr(res);
          ctl.setError(e.text, e.tech);
          return false;
        });
      }
    });
  }

  TR.places = { openForm: openForm };

  /* ---------- candidates ---------- */
  // 清單被後端截過時說清楚只列了幾筆,免得跟分頁上的總數對不起來
  function setMore(el, shown, cnt){
    var more = !!cnt && (cnt.plus || cnt.n > shown);
    el.hidden = !more;
    el.textContent = more ? '只列出前 ' + num(shown) + ' 筆,共 ' + TR.fmt.count(cnt) + ' 筆' : '';
  }
  function candRows(){ var v = TR.data.value('placeCands'); return v && Array.isArray(v.rows) ? v.rows : null; }
  function spreadBadge(c){
    var sp = Number(c.spread_m) | 0;
    if ((Number(c.n) || 0) <= 1) return TR.ui.badge('只查過 1 次', 'neutral');
    if (sp <= 80) return TR.ui.badge(num(sp) + ' 公尺', 'ok');
    if (sp <= 300) return TR.ui.badge(num(sp) + ' 公尺', 'warn');
    return TR.ui.badge(num(sp) + ' 公尺 ⚠', 'danger');
  }
  function candColumns(){
    var cols = [];
    if (isAdmin()) {
      cols.push({ key: 'sel', label: '', className: 'plc-sel', mobile: 'select', render: function(c){
        var cb = h('input', { type: 'checkbox', class: 'plc-cb', checked: !!S.candSel[c.norm_key], attrs: { 'aria-label': '選取「' + (c.name || '') + '」' } });
        cb.dataset.k = String(c.norm_key);
        cb.addEventListener('change', function(){
          if (cb.checked) S.candSel[c.norm_key] = true; else delete S.candSel[c.norm_key];
          updateCandBatch();
        });
        return h('label', { class: 'check is-bare' }, cb);
      } });
    }
    cols.push(
      { key: 'name', label: '名稱', mobile: 'title', render: function(c){ return h('span', { class: 'plc-name', text: c.name || '—' }); } },
      { key: 'n', label: '次數', align: 'right', mobile: 'meta', render: function(c){ return h('span', { class: 'num', text: num(c.n || 0) }); } },
      { key: 'drivers', label: '司機', mobile: 'meta', render: function(c){
        var list = c.drivers || [];
        var who = list.slice(0, 3).join('、') + (list.length > 3 ? '…' : '');
        return h('div', { class: 'plc-cell' }, h('span', { class: 'num', text: num(c.drivers_n || 0) + ' 位' }), who ? h('span', { class: 'plc-sub', text: who }) : null);
      } },
      { key: 'spread', label: '座標一致度', mobile: 'meta', render: spreadBadge },
      { key: 'coord', label: '座標', mobile: 'hide', render: function(c){ return mapLink(c.lat, c.lng, 4); } }
    );
    if (isAdmin()) {
      cols.push({ key: 'act', label: '動作', align: 'right', mobile: 'actions', render: function(c){
        return h('div', { class: 'tbl-actions' },
          TR.ui.button({ label: '補進位置庫', size: 'sm', variant: 'secondary', onClick: function(){ adoptCand(c); } }),
          TR.ui.button({ label: '忽略', size: 'sm', variant: 'ghost', onClick: function(){ return dismissCand(c, false); } }));
      } });
    }
    return cols;
  }
  function adoptCand(c){
    openForm(null, { name: c.name || '', coord: finite(c.lat) && finite(c.lng) ? Number(c.lat) + ', ' + Number(c.lng) : '' }, function(){
      return TR.api('dismissCandidate', { norm_key: c.norm_key });
    });
  }
  function dismissCand(c, undo){
    var name = c.name || '';
    var payload = { norm_key: c.norm_key };
    if (undo) payload.undo = true;
    return TR.api('dismissCandidate', payload).then(function(res){
      if (!res || !res.ok) { failToast(undo ? '復原失敗' : '忽略失敗', TR.err(res), res); return; }
      if (!undo) {
        var v = TR.data.value('placeCands'), rows = candRows();
        delete S.candSel[c.norm_key];
        if (rows) {
          var left = rows.filter(function(x){ return x.norm_key !== c.norm_key; });
          TR.data.set('placeCands', Object.assign({}, v, { rows: left, total: v.total != null ? Math.max(0, v.total - (rows.length - left.length)) : null }));
        }
        TR.toast({ type: 'ok', text: '已忽略「' + name + '」', action: { label: '復原', onClick: function(){ return dismissCand(c, true); } } });
      } else {
        TR.toast({ type: 'ok', text: '已復原「' + name + '」' });
      }
      TR.data.load('placeCands', { force: true });
    });
  }
  function selectedKeys(){
    var rows = candRows() || [];
    return rows.filter(function(r){ return S.candSel[r.norm_key]; }).map(function(r){ return r.norm_key; });
  }
  function bulkDismiss(){
    var ks = selectedKeys();
    if (!ks.length) return;
    TR.dialog.confirm({
      level: 'C',
      title: '忽略 ' + ks.length + ' 筆候選?',
      body: '忽略後這些候選不會再出現在清單。',
      confirmText: '忽略 ' + ks.length + ' 筆',
      onConfirm: function(){
        return Promise.all(ks.map(function(k){ return TR.api('dismissCandidate', { norm_key: k }); })).then(function(rs){
          var okN = rs.filter(function(r){ return r && r.ok; }).length;
          if (rs.some(silentErr)) return true;
          rs.forEach(function(r, i){ if (r && r.ok) delete S.candSel[ks[i]]; });
          var bad = rs.filter(function(r){ return !(r && r.ok); })[0];
          if (okN === ks.length) TR.toast({ type: 'ok', text: '已忽略 ' + okN + '/' + ks.length + ' 筆' });
          else TR.toast({ type: 'err', text: '已忽略 ' + okN + '/' + ks.length + ' 筆,其餘沒有成功', detail: bad ? TR.err(bad).tech : null });
          TR.data.load('placeCands', { force: true });
          return true;
        });
      }
    });
  }
  function syncCandChecks(){
    if (!UI.candTableHost) return;
    Array.prototype.forEach.call(UI.candTableHost.querySelectorAll('input.plc-cb'), function(cb){
      cb.checked = !!S.candSel[cb.dataset.k];
    });
    updateCandBatch();
  }
  function updateCandBatch(){
    if (!UI.candBatch) return;
    var rows = candRows() || [];
    var n = selectedKeys().length;
    UI.candAll.input.checked = rows.length > 0 && n === rows.length;
    UI.candAll.input.indeterminate = n > 0 && n < rows.length;
    UI.candBatch.hidden = n === 0;
    UI.candBatchText.textContent = '已選 ' + num(n) + ' 筆';
    setBtnLabel(UI.candBatchBtn, '忽略勾選的 ' + num(n) + ' 筆');
    TR.ui.syncBatch();
  }

  function buildCandPane(){
    var pane = UI.candPane;
    UI.candState = h('div');
    UI.candContent = h('div', { class: 'plc-pane', hidden: true });
    if (isAdmin()) {
      UI.candAll = checkBox('全選', false, function(on){
        (candRows() || []).forEach(function(r){ if (on) S.candSel[r.norm_key] = true; else delete S.candSel[r.norm_key]; });
        syncCandChecks();
      });
      UI.candToolbar = h('div', { class: 'toolbar' }, UI.candAll.el);
      UI.candBatchText = h('span', { class: 'grow num' });

      UI.candBatch = h('div', { class: 'batch-bar', hidden: true }, UI.candBatchText,
        TR.ui.button({ label: '清除', size: 'sm', variant: 'ghost', onClick: function(){ S.candSel = {}; syncCandChecks(); } }),
        UI.candBatchBtn);
      UI.candContent.appendChild(UI.candToolbar);
    }
    UI.candErr = h('div', { class: 'plc-inline-err', hidden: true });
    UI.candTableHost = h('div');
    UI.candEmpty = h('div', { hidden: true }, TR.ui.emptyState({ title: '目前沒有候選', text: '付費查到的新地名會出現在這裡。' }));
    UI.candContent.appendChild(h('p', { class: 'plc-summary only-mobile' }, '座標一致度 ', TR.ui.info(SPREAD_INFO)));
    UI.candMore = h('p', { class: 'plc-summary', hidden: true });
    UI.candContent.appendChild(UI.candErr);
    UI.candContent.appendChild(UI.candMore);
    if (UI.candBatch) UI.candContent.appendChild(UI.candBatch);
    UI.candContent.appendChild(UI.candTableHost);
    UI.candContent.appendChild(UI.candEmpty);
    pane.appendChild(UI.candState);
    pane.appendChild(UI.candContent);
  }

  function renderCands(){
    if (!UI.candState) return;
    var st = TR.data.get('placeCands');
    var rows = candRows();
    if (!rows) {
      UI.candContent.hidden = true;
      UI.candState.hidden = false;
      UI.candState.textContent = '';
      UI.candState.appendChild(st.error ? errorState('候選清單讀取失敗', st.error) : TR.ui.skeleton({ variant: 'table' }));
      return;
    }
    UI.candState.hidden = true;
    UI.candState.textContent = '';
    UI.candContent.hidden = false;
    setInlineErr(UI.candErr, st.error);
    setMore(UI.candMore, rows.length, TR.data.count(st.value));
    var keep = {};
    rows.forEach(function(r){ if (S.candSel[r.norm_key]) keep[r.norm_key] = true; });
    S.candSel = keep;
    if (UI.candToolbar) UI.candToolbar.hidden = !rows.length;
    if (!rows.length) {
      UI.candTableHost.hidden = true;
      UI.candEmpty.hidden = false;
    } else {
      UI.candEmpty.hidden = true;
      UI.candTableHost.hidden = false;
      if (!UI.candTable) {
        UI.candTable = TR.ui.table({ columns: candColumns(), rows: rows, rowKey: function(c){ return 'c' + c.norm_key; } });
        Array.prototype.forEach.call(UI.candTable.el.querySelectorAll('th'), function(th){
          if (th.textContent === '座標一致度') th.appendChild(TR.ui.info(SPREAD_INFO));
        });
        UI.candTableHost.appendChild(UI.candTable.el);
      } else {
        UI.candTable.update(rows);
      }
    }
    syncCandChecks();
  }

  /* ---------- miss queue ---------- */
  var KIND = { landmark: ['地標', 'ok'], address: ['地址', 'warn'], fragment: ['殘段', 'neutral'] };
  function missData(){
    if (S.missAll) return { value: S.missAllData, error: S.missAllErr };
    var st = TR.data.get('missQueue');
    return { value: st.value, error: st.error };
  }
  function loadMissAll(){
    var seq = ++S.missAllSeq;
    return TR.api('missQueue', { all: true }).then(function(res){
      if (seq !== S.missAllSeq) return;
      var v = res && !res.error ? TR.data.pickCapped(res, 40) : undefined;
      if (v) { S.missAllData = v; S.missAllErr = null; }
      else if (!silentErr(res)) S.missAllErr = TR.err(res);
      if (S.missAll) { renderMiss(); updateCounts(); }
    });
  }
  function missRow(m){
    var k = KIND[m.kind] || KIND.fragment;
    var vars = (m.variants || []).slice(0, 3).join('、');
    var main = h('div', { class: 'plc-miss-main' },
      h('div', { class: 'row row-wrap' }, TR.ui.badge(k[0], k[1]), h('span', { class: 'plc-name', text: m.q || '' })),
      vars ? h('p', { class: 'plc-sub', text: '原字:' + vars }) : null);
    if (m.raw) {
      var open = !!S.missOpen[m.q];
      var raw = h('button', { type: 'button', class: 'plc-raw' + (open ? ' is-open' : ''), text: m.raw, attrs: { 'aria-expanded': open ? 'true' : 'false', title: '點一下展開或收合原文' } });
      raw.addEventListener('click', function(){
        var o = !raw.classList.contains('is-open');
        raw.classList.toggle('is-open', o);
        raw.setAttribute('aria-expanded', o ? 'true' : 'false');
        if (o) S.missOpen[m.q] = true; else delete S.missOpen[m.q];
      });
      main.appendChild(raw);
    }
    main.appendChild(h('p', { class: 'plc-sub', text: '來源:' + ((m.drivers || []).join('、') || '—') + '・最後 ' + TR.fmt.rel(m.last) }));
    var el = h('div', { class: 'plc-miss' }, main,
      h('div', { class: 'plc-miss-hot' },
        h('span', { class: 'plc-hot-n', text: num(m.dn || 0) + ' 位司機' }),
        h('span', { class: 'plc-sub', text: '共 ' + num(m.n || 0) + ' 次' })));
    if (isAdmin()) {
      el.appendChild(h('div', { class: 'plc-miss-acts' },
        TR.ui.button({ label: '補進位置庫', size: 'sm', variant: 'secondary', onClick: function(){
          openForm(null, { name: m.q || '', alias: (m.variants || []).filter(function(v){ return v !== m.q; }).join(', ') });
        } }),
        TR.ui.button({ label: '標為噪音', size: 'sm', variant: 'ghost', onClick: function(){ ignoreMiss(m); } })));
    }
    el._sig = sig(m);
    return el;
  }
  function ignoreMiss(m){
    return TR.dialog.confirm({
      level: 'C',
      title: '標為噪音?',
      body: '「' + (m.q || '') + '」之後永久不會再出現在清單。',
      confirmText: '標為噪音',
      onConfirm: function(ctl){
        return TR.api('ignoreMiss', { q: m.q, qs: m.variants || [] }).then(function(res){
          if (!res || !res.ok) { var e = TR.err(res); ctl.setError(e.text, e.tech); return false; }
          TR.toast({ type: 'ok', text: '已把「' + (m.q || '') + '」標為噪音' });

      }

  }
  function buildMissPane(){

  function renderMiss(){

      UI.missMore.hidden = true;
      UI.missErr.hidden = true;

      UI.missEmpty.hidden = true;
      UI.missState.hidden = false;
      UI.missState.textContent = '';

    var rows = d.value.rows || [];
    setMore(UI.missMore, rows.length, TR.data.count(d.value));
    if (!rows.length) {
      UI.missList.hidden = true;
      UI.missEmpty.hidden = false;
      UI.missEmpty.textContent = '';
      UI.missEmpty.appendChild(TR.ui.emptyState({ title: S.missAll ? '近 30 天沒有查不到的地點' : '近 30 天沒有需要補的地標' }));
      return;

    UI.missEmpty.hidden = true;
    UI.missList.hidden = false;
    TR.ui.keyed(UI.missList, rows, function(m){ return 'm' + m.q; }, missRow, function(el, m){
      return el._sig === sig(m) ? el : missRow(m);

  /* ---------- pending card ---------- */
  function updateCounts(){

  /* ---------- coordinate assets ---------- */
  var GA_STATUS = { active: ['服務中', 'ok'], candidate: ['待審', 'warn'], suspect: ['存疑', 'danger'], revoked: ['撤回', 'neutral'], superseded: ['已取代', null] };

    map8: '舊圖資(已停用)', door_plates: '門牌資料', community: '位置庫', admin: '人工', unknown: '來源不明' };
  var PREC_OPTS = [{ value: 'unknown', label: '未知' }, { value: 'door', label: '門牌' }, { value: 'place', label: '地點' }, { value: 'road', label: '路段' }, { value: 'area', label: '區域' }];
  var SPREAD_INFO = '歷次查到的位置最遠差幾公尺。差距大代表每次查到不同地方,請先自己查證。';
  var REVOKE_HELP ='撤回後這個地址不再使用這個位置,之後查到同一點(30 公尺內)也不採用。不會刪除資料,隨時可以按「啟用」恢復。連帶處理會把座標完全相同的其他地址一併標存疑,超過 50 筆會先問你。';
  var SUSPECT_HELP = '存疑會暫停使用這個位置,但不刪除資料。隨時可以按「啟用」恢復。之後即時查到明顯不同的位置,會自動當成修正。';

  function gaStatusNode(s){
    var c = GA_STATUS[s];
    if (!c) return TR.ui.badge('其他狀態', 'neutral');
    if (!c[1]) return h('span', { class: 'muted', text: c[0] });
    return TR.ui.badge(c[0], c[1]);
  }
  function gaStatusText(s){ var c = GA_STATUS[s]; return c ? c[0] : '其他狀態'; }
  function gaReadErr(res){
    var e = res && res.error;
    if (e === 'rpc_missing_run_sql_v48' || e === 'unknown_action' || e === 'no_key' || e === 'forbidden_viewer') {
      return { text: '這項功能還沒啟用,請聯絡工程人員', tech: TR.err(res).tech };
    }
    return TR.err(res);
  }
  function gaWriteErr(res){
    var e = res && res.error;
    var tech = TR.err(res).tech;
    if (e === 'not_found') return { text: '找不到這筆資料,可能已變更,請重新查詢', tech: tech };
    if (e === 'bad_coords') return { text: '座標不在台灣範圍', tech: tech };
    if (e === 'db_error' && /conflict_retry/.test(String((res && res.detail) || ''))) return { text: '剛好有其他更新,請再按一次', tech: tech };
    if (e === 'rpc_missing_run_sql_v48' || e === 'unknown_action' || e === 'no_key' || e === 'forbidden_viewer') return gaReadErr(res);
    return TR.err(res);
  }
  function gaUndoNote(res){
    var p = [];
    if (Number(res.restored) > 0) p.push('還原 ' + num(res.restored) + ' 筆');
    if (Number(res.released_candidates) > 0) p.push('放行 ' + num(res.released_candidates) + ' 筆待審');
    return p.length ? '(同時' + p.join('、') + ')' : '';
  }

  function loadGaStats(){
    if (!TR.can('read', 'geoAssetStats')) return Promise.resolve();
    return TR.api('geoAssetStats', {}).then(function(res){
      if (silentErr(res)) return;
      if (res && res.ok && !res.missing) { S.gaStats = res; S.gaStatsErr = null; }
      else if (res && res.ok && res.missing) { S.gaStats = null; S.gaStatsErr = { text: '這項功能還沒啟用,請聯絡工程人員', tech: String(res.warning || 'missing') }; }
      else { S.gaStats = null; S.gaStatsErr = gaReadErr(res); }
      renderGaStats();
    });
  }
  function aggLabels(obj, map, otherLabel, unknownOut){
    var agg = {};
    Object.keys(obj || {}).forEach(function(k){
      var label = map[k];
      if (!label) { unknownOut.push(k); label = otherLabel; }
      agg[label] = (agg[label] || 0) + (Number(obj[k]) || 0);
    });
    return Object.keys(agg).sort(function(a, b){ return agg[b] - agg[a]; }).map(function(l){ return l + ' ' + num(agg[l]); }).join('・') || '—';
  }
  function renderGaStats(){
    if (!UI.gaStatsBody) return;
    var s = S.gaStats;
    if (UI.gaReviewBtn) setBtnLabel(UI.gaReviewBtn, s ? '待審・存疑 ' + num(Number(s.review) || 0) : '待審・存疑');
    var box = UI.gaStatsBody;
    box.textContent = '';
    if (!s) {
      if (S.gaStatsErr) box.appendChild(h('div', { class: 'stack-1' }, h('p', { class: 'muted', text: S.gaStatsErr.text }), S.gaStatsErr.tech ? TR.ui.tech(S.gaStatsErr.tech) : null));
      else box.appendChild(TR.ui.skeleton({ variant: 'lines', lines: 3 }));
      return;
    }
    var bs = s.by_status || {};
    var statusLine = h('div', { class: 'row row-wrap' }, ['active', 'candidate', 'suspect', 'revoked', 'superseded'].map(function(k){
      var c = GA_STATUS[k];
      var t = c[0] + ' ' + num(Number(bs[k]) || 0);
      return c[1] ? TR.ui.badge(t, c[1]) : h('span', { class: 'muted num', text: t });
    }));
    var prec = s.active_by_precision || {};
    var precText = ['door', 'place', 'road', 'area', 'unknown'].filter(function(k){ return Number(prec[k]) > 0; })
      .map(function(k){ return GA_PREC[k] + ' ' + num(prec[k]); }).join('・') || '—';
    var unknown = [];
    var provText = aggLabels(s.active_by_provider, GA_PROV, '其他來源', unknown);
    var orgText = aggLabels(s.by_origin, GA_ORIGIN, '其他', unknown);
    box.appendChild(TR.ui.kv([
      ['版本總數', num(Number(s.total) || 0)],
      ['待審・存疑', num(Number(s.review) || 0)],
      ['狀態', statusLine],
      ['服務中・精度', precText],
      ['服務中・來源', provText],
      ['全部・出處', orgText]
    ]));
    if (unknown.length) box.appendChild(TR.ui.tech('未對照的值:' + unknown.join(', ')));
  }

  function gaColumns(){
    var cols = [
      { key: 'addr', label: '地址', mobile: 'title', render: function(a){
        var techParts = [];
        if (a.base_q && a.base_q !== a.q) techParts.push('q: ' + a.q);
        if (a.namespace) techParts.push('namespace: ' + a.namespace);
        if (a.grid) techParts.push('grid: ' + a.grid);
        return h('div', { class: 'plc-cell' },
          h('div', { class: 'row row-wrap' }, h('span', { class: 'plc-name', text: a.base_q || a.q || '—' }), a.scope === 'grid' ? TR.ui.badge('限附近', 'neutral') : null),
          techParts.length ? TR.ui.tech(techParts.join('\n')) : null);
      } },
      { key: 'coord', label: '座標', mobile: 'meta', render: function(a){ return mapLink(a.lat, a.lng, 5); } },
      { key: 'src', label: '來源', mobile: 'meta', render: function(a){
        var techParts = [];
        if (a.provider && !GA_PROV[a.provider]) techParts.push('provider: ' + a.provider);
        if (a.source_via) techParts.push('via: ' + a.source_via);
        if (a.derived_from) techParts.push('derived_from: ' + a.derived_from);
        return h('div', { class: 'plc-cell' },
          h('span', { text: a.provider ? (GA_PROV[a.provider] || '其他來源') : '—' }),
          h('span', { class: 'plc-sub', text: '精度 ' + (GA_PREC[a.precision_class] || '未知') + '・出處 ' + (GA_ORIGIN[a.origin] || (a.origin ? '其他' : '—')) }),
          techParts.length ? TR.ui.tech(techParts.join('\n')) : null);
      } },
      { key: 'status', label: '狀態', mobile: 'sub', render: function(a){
        return h('div', { class: 'plc-cell' },
          h('div', { class: 'row row-wrap' }, gaStatusNode(a.status), a.coord_revoked ? TR.ui.badge('同位置已被撤回,暫停使用', 'danger') : null),
          a.status_reason ? h('span', { class: 'plc-sub', text: String(a.status_reason) }) : null,
          h('span', { class: 'plc-sub', text: '變更 ' + TR.fmt.dateTimeFull(a.status_changed_at) }));
      } },
      { key: 'time', label: '時間', mobile: 'meta', render: function(a){
        return h('div', { class: 'plc-cell' },
          h('span', { class: 'plc-sub num', text: '第 ' + (a.revision != null ? a.revision : '—') + ' 版・命中 ' + num(a.hits || 0) }),
          h('span', { class: 'plc-sub', text: '取得 ' + (a.source_fetched_at ? TR.fmt.dateTimeFull(a.source_fetched_at) : '未知') }),
          h('span', { class: 'plc-sub', text: '最後使用 ' + (a.last_hit_at ? TR.fmt.rel(a.last_hit_at) : '—') }));
      } }
    ];
    if (isAdmin()) {
      cols.push({ key: 'act', label: '動作', align: 'right', mobile: 'actions', render: function(a){
        var btns = [];
        if (a.status === 'active') {
          if (a.coord_revoked) btns.push(TR.ui.button({ label: '確認採用', size: 'sm', variant: 'secondary', onClick: function(){ gaActivate(a); } }));
          btns.push(TR.ui.button({ label: '撤回', size: 'sm', variant: 'secondary', onClick: function(){ gaStatusForm(a, 'revoked', false); } }));
          btns.push(TR.ui.button({ label: '存疑', size: 'sm', variant: 'secondary', onClick: function(){ gaStatusForm(a, 'suspect', false); } }));
        } else {
          btns.push(TR.ui.button({ label: '啟用', size: 'sm', variant: 'secondary', onClick: function(){ gaActivate(a); } }));
        }
        if (a.status === 'revoked') btns.push(TR.ui.button({ label: '重新連帶', size: 'sm', variant: 'secondary', onClick: function(){ gaStatusForm(a, 'revoked', true); } }));
        btns.push(TR.ui.button({ label: '改座標', size: 'sm', variant: 'ghost', onClick: function(){ gaFixForm(a); } }));
        return h('div', { class: 'plc-acts' }, btns);
      } });
    }
    return cols;
  }

  function gaLoading(){
    UI.gaHead.textContent = '查詢中…';
    UI.gaHead.hidden = false;
    UI.gaHeadTech.textContent = '';
    UI.gaTableHost.hidden = true;
    UI.gaEmpty.hidden = true;
    UI.gaLegacy.textContent = '';
    UI.gaLegacy.hidden = true;
  }
  function gaListError(errObj){
    UI.gaHead.textContent = '';
    UI.gaHead.hidden = true;
    UI.gaHeadTech.textContent = '';
    UI.gaTableHost.hidden = true;
    UI.gaLegacy.hidden = true;
    UI.gaEmpty.hidden = false;
    UI.gaEmpty.textContent = '';
    UI.gaEmpty.appendChild(errorState('查詢失敗', errObj));
  }
  function gaRender(head, rows, emptyMsg, legacy, tech){
    UI.gaHead.textContent = head;
    UI.gaHead.hidden = false;
    UI.gaHeadTech.textContent = '';
    if (tech) UI.gaHeadTech.appendChild(TR.ui.tech(tech));
    if (!rows.length) {
      UI.gaTableHost.hidden = true;
      UI.gaEmpty.hidden = false;
      UI.gaEmpty.textContent = '';
      UI.gaEmpty.appendChild(TR.ui.emptyState({ title: emptyMsg }));
    } else {
      UI.gaEmpty.hidden = true;
      UI.gaTableHost.hidden = false;
      if (!UI.gaTable) {
        UI.gaTable = TR.ui.table({ columns: gaColumns(), rows: rows, rowKey: function(a){ return 'a' + a.id; } });
        UI.gaTableHost.appendChild(UI.gaTable.el);
      } else {
        UI.gaTable.update(rows);
      }
    }
    UI.gaLegacy.textContent = '';
    UI.gaLegacy.hidden = !legacy.length;
    if (legacy.length) {
      UI.gaLegacy.appendChild(h('p', { class: 'plc-legacy-title', text: '舊資料' }));
      legacy.forEach(function(g){
        var miss = /^miss/.test(String(g.via || ''));
        UI.gaLegacy.appendChild(h('div', { class: 'plc-legacy-row' },
          String(g.q || '') + '・',
          miss ? '查無' : mapLink(g.lat, g.lng, 5),
          '・命中 ' + num(g.hits || 0) + '・最後寫入 ' + TR.fmt.dateTimeFull(g.created_at)));
      });
    }
  }
  function gaSearch(q){
    q = String(q || '').trim();
    if (!q) { TR.toast({ type: 'info', text: '先輸入地址再查詢' }); return Promise.resolve(); }
    S.gaLast = { kind: 'search', q: q };
    var seq = ++S.gaSeq;
    gaLoading();
    if (TR.router.current().page === NAME) TR.router.setParams({ ga: q });
    return TR.api('geoAssetLookup', { q: q }).then(function(res){
      if (seq !== S.gaSeq) return;
      if (!res || !res.ok) { if (!silentErr(res)) gaListError(gaReadErr(res)); return; }
      var assets = res.assets || [], legacy = res.legacy || [];
      var head = '找到 ' + num(assets.length) + ' 個版本' + (legacy.length ? '・舊資料 ' + num(legacy.length) + ' 筆' : '');
      if (Number(res.total) > assets.length) {
        head += '(只顯示前 ' + num(assets.length) + ' 筆,共 ' + (Number(res.total) > 500 ? '500+' : num(res.total)) + ' 筆,輸入完整地址可縮小範圍)';
      }
      gaRender(head, assets, legacy.length ? '這個地址沒有版本紀錄,下面是舊資料' : '查不到這個地址的紀錄,可以試試貼上完整地址', legacy,
        '查詢鍵:' + (res.keys || []).join(' / '));
    });
  }
  function gaLoadReview(){
    S.gaLast = { kind: 'review' };
    var seq = ++S.gaSeq;
    gaLoading();
    if (TR.router.current().page === NAME) TR.router.setParams({ ga: '' });
    return TR.api('geoAssetReview', { statuses: ['candidate', 'suspect'] }).then(function(res){
      if (seq !== S.gaSeq) return;
      if (!res || !res.ok) { if (!silentErr(res)) gaListError(gaReadErr(res)); return; }
      var rows = res.rows || [];
      gaRender('待審・存疑 ' + num(rows.length) + ' 筆(最近變更在前)', rows, '目前沒有待審或存疑的位置', [], null);
    });
  }
  function gaReload(){
    if (!S.gaLast) return Promise.resolve();
    return S.gaLast.kind === 'review' ? gaLoadReview() : gaSearch(S.gaLast.q);
  }
  function gaAfterWrite(){ gaReload(); loadGaStats(); }

  function gaStatusForm(a, status, resweep){
    var isRevoke = status === 'revoked';
    var addr = a.base_q || a.q || '';
    var kind = 'gaStatus|' + a.id + '|' + status;
    var fields = [
      { id: 'help', type: 'custom', render: function(w){ w.appendChild(h('p', { class: 'dialog-desc row' }, h('span', { text: isRevoke ? '撤回後會怎樣' : '存疑後會怎樣' }), TR.ui.info(isRevoke ? REVOKE_HELP : SUSPECT_HELP))); } },
      { id: 'reason', label: '原因(選填)', type: 'textarea', rows: 3, maxLength: 200, placeholder: isRevoke ? '例:司機回報定到隔壁巷' : '例:位置看起來偏了,待查證', hint: '最多 200 字,會記在這個位置上' }
    ];
    if (isRevoke) fields.push({ id: 'cascade', label: '同一位置的其他地址一併標存疑(建議)', type: 'checkbox', value: true });
    var actionText = resweep ? '重新連帶' : (isRevoke ? '撤回' : '標存疑');
    return TR.dialog.form({
      title: resweep ? '重新連帶處理' : (isRevoke ? '撤回位置' : '標為存疑'),
      description: '「' + addr + '」',
      level: 'B',
      fields: fields,
      submitText: actionText,
      review: function(v){
        var rows = [
          { label: '地址', to: addr },
          { label: '狀態', from: gaStatusText(a.status), to: isRevoke ? '撤回' : '存疑' }
        ];
        if (isRevoke) rows.push({ label: '同一位置的其他地址', to: v.cascade ? '一併標存疑' : '不處理' });
        return { title: '請確認', rows: rows };
      },
      onSubmit: function(v, ctl){
        var payload = { id: a.id, status: status, reason: String(v.reason || '').trim(),
          cascade: isRevoke ? !!v.cascade : false, request_id: TR.intent.id(kind) };
        function send(force){
          return TR.api('geoAssetSetStatus', force ? Object.assign({ force: true }, payload) : payload).then(function(res){
            if (res && res.error === 'cascade_too_large' && !force) {
              return TR.dialog.confirm({
                level: 'C',
                title: '全部標存疑?',
                body: '這個位置還有 ' + num(res.would_cascade) + ' 個其他地址在使用。全部標存疑後,這些地址會改走即時查詢(可能產生費用)。確定要全部標存疑?',
                confirmText: '全部標存疑',
                cancelText: '這次不做'
              }).then(function(ok){
                if (ok) return send(true);
                TR.intent.settle(kind, res);
                ctl.setError('已取消,這次沒有做任何變更。可以返回取消勾選「同一位置的其他地址一併標存疑」,只撤回這一筆。');
                return false;
              });
            }
            TR.intent.settle(kind, res);
            if (res && res.ok) {
              var text;
              if (res.unchanged && !Number(res.cascaded)) text = '狀態沒有改變';
              else if (isRevoke) text = '已撤回' + (Number(res.cascaded) > 0 ? '(連帶 ' + num(res.cascaded) + ' 筆標存疑)' : '');
              else text = '已標存疑' + gaUndoNote(res);
              TR.toast({ type: 'ok', text: text });
              gaAfterWrite();
              return true;
            }
            if (silentErr(res)) return false;
            var e = gaWriteErr(res);
            ctl.setError(e.text, e.tech);
            return false;
          });
        }
        return send(false);
      }
    });
  }

  function gaActivate(a){
    var confirmMode = a.status === 'active' && !!a.coord_revoked;
    var kind = 'gaStatus|' + a.id + '|active';
    return TR.dialog.confirm({
      level: 'B',
      title: confirmMode ? '確認採用這個位置?' : '啟用這個版本?',
      body: '這個地址目前服務中的版本會被取代,App 之後使用這個位置。',
      rows: [
        { label: '地址', to: a.base_q || a.q || '' },
        { label: '位置', from: '—', to: pair(a.lat, a.lng, 5) }
      ],
      confirmText: confirmMode ? '確認採用' : '啟用',
      onConfirm: function(ctl){
        return TR.api('geoAssetSetStatus', { id: a.id, status: 'active', reason: '後台人工啟用', cascade: false, request_id: TR.intent.id(kind) }).then(function(res){
          TR.intent.settle(kind, res);
          if (res && res.ok) {
            TR.toast({ type: 'ok', text: res.confirmed ? '已確認採用' : (res.unchanged ? '狀態沒有改變' : '已啟用' + gaUndoNote(res)) });
            gaAfterWrite();
            return true;
          }
          if (silentErr(res)) return true;
          var e = gaWriteErr(res);
          ctl.setError(e.text, e.tech);
          return false;
        });
      }
    });
  }

  function gaFixForm(a){
    var addr = a.base_q || a.q || '';
    return TR.dialog.form({
      title: '改座標',
      description: '「' + addr + '」',
      level: 'B',
      submitText: '存成新版本',
      fields: [
        { id: 'lat', label: '緯度', type: 'coord', value: finite(a.lat) ? a.lat : '', placeholder: '25.03300', hint: '在 Google 地圖長按或右鍵點位置,複製座標貼上(整組貼上會自動分開)' },
        { id: 'lng', label: '經度', type: 'coord', value: finite(a.lng) ? a.lng : '', placeholder: '121.56500' },
        { id: 'precision', label: '精度', type: 'select', options: PREC_OPTS, value: GA_PREC[a.precision_class] ? a.precision_class : 'unknown', hint: '只有確定是那個門牌的位置才選「門牌」' },
        { id: 'reason', label: '原因(選填)', type: 'textarea', rows: 3, maxLength: 200, placeholder: '例:依司機回報改到社區大門口' }
      ],
      onChange: function(id, v, ctl){
        if (id !== 'lat' && id !== 'lng') return;
        var s = String(v[id] || '');
        if (!/[,，]/.test(s)) return;
        var c = parseCoord(s);
        if (c) { ctl.setValue('lat', c.lat); ctl.setValue('lng', c.lng); }
      },
      validate: function(v){
        var lat = parseFloat(v.lat), lng = parseFloat(v.lng);
        if (!isFinite(lat) || !isFinite(lng)) return '緯度和經度要填數字';
        if (lat < 21.5 || lat > 26.5 || lng < 118 || lng > 122.5) return '座標不在台灣範圍(緯度 21.5–26.5、經度 118–122.5)';
        return null;
      },
      review: function(v){
        return {
          title: '請確認新的位置',
          rows: [
            { label: '地址', to: addr },
            { label: '座標', from: pair(a.lat, a.lng, 5), to: pair(v.lat, v.lng, 5) },
            { label: '精度', from: GA_PREC[a.precision_class] || '未知', to: GA_PREC[v.precision] || '未知' }
          ],
          note: '會新增一個人工版本,舊版本保留為歷史紀錄。'
        };
      },
      onSubmit: function(v, ctl){
        var payload = { q: a.q, lat: parseFloat(v.lat), lng: parseFloat(v.lng), precision: GA_PREC[v.precision] ? v.precision : 'unknown', reason: String(v.reason || '').trim() };
        return TR.api('geoAssetAdminSet', payload).then(function(res){
          if (res && res.ok) {
            TR.toast({ type: 'ok', text: '已改座標(第 ' + (res.revision != null ? res.revision : '—') + ' 版)' + gaUndoNote(res) });
            gaAfterWrite();
            return true;
          }
          if (silentErr(res)) return false;
          if (res && (res.error === 'network' || res.error === 'bad_response')) {
            ctl.setError('結果未確認,請先重新查詢確認是否已生效,再決定要不要重送', TR.err(res).tech);
            return false;
          }
          var e = gaWriteErr(res);
          ctl.setError(e.text, e.tech);
          return false;
        });
      }
    });
  }

  function buildGaStats(section){
    var card = TR.ui.card({
      title: '永久座標資產',
      info: '全隊累積的地址座標版本。服務中才會被 App 使用;撤回、存疑不會刪資料,隨時可以再啟用。'
    });
    UI.gaStatsBody = h('div', { class: 'plc-stats-body' });
    card.body.appendChild(UI.gaStatsBody);
    section.appendChild(card.el);
  }

  function buildGa(section){
    UI.gaReviewBtn = TR.ui.button({ label: '待審・存疑', size: 'sm', variant: 'ghost', className: 'num', onClick: function(){
      UI.gaCard.setOpen(true);
      return gaLoadReview();
    } });
    var card = TR.ui.card({
      title: '座標查詢與修正', collapsible: true, open: false, persistKey: 'plc-ga',
      info: '每個地址的位置都保留版本。服務中才會被 App 使用;撤回或存疑不會刪資料,隨時可以再啟用。',
      actions: [UI.gaReviewBtn]
    });
    UI.gaCard = card;
    UI.gaSearch = TR.ui.searchInput({ placeholder: '輸入地址查詢', debounce: 100000, onInput: function(){} });
    UI.gaSearch.input.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); gaSearch(UI.gaSearch.input.value); }
    });
    var searchBtn = TR.ui.button({ label: '查詢', variant: 'primary', onClick: function(){ return gaSearch(UI.gaSearch.input.value); } });
    UI.gaHead = h('p', { class: 'plc-ga-head', hidden: true, attrs: { role: 'status' } });
    UI.gaHeadTech = h('div');
    UI.gaTableHost = h('div', { hidden: true });
    UI.gaEmpty = h('div', { hidden: true });
    UI.gaLegacy = h('div', { class: 'plc-legacy', hidden: true });
    card.body.appendChild(h('div', { class: 'stack-3' },
      h('div', { class: 'toolbar plc-ga-search' }, UI.gaSearch.el, searchBtn),
      UI.gaHead, UI.gaHeadTech, UI.gaTableHost, UI.gaEmpty, UI.gaLegacy));
    section.appendChild(card.el);
  }

  /* ---------- batch import ---------- */
  function parseLines(text){
    return String(text || '').split('\n')
      .map(function(s){ return s.replace(/\s*←.*$/, '').trim(); })
      .filter(function(s){ return s && !/[═─]|^──|^⚠|^用法|^格式/.test(s); });
  }
  function openBatch(){
    if (!isAdmin()) return;
    var rows = [], running = false, writing = false, cancelled = false, table = null;
    var ta, lookupBtn, writeBtn, progress, resultsWrap, tableHost, allChk, hideChk, lineCount, dctl;

    function batchStateNode(r){
      if (r.state === 'pending') return h('span', { class: 'faint', text: '待查' });
      if (r.state === 'looking') return h('span', { class: 'muted', text: '查詢中…' });
      if (r.state === 'written') return TR.ui.badge('已寫入', 'ok');
      if (r.state === 'dup') return TR.ui.badge('已有同名', 'neutral');
      if (r.state === 'failed') return TR.ui.badge('寫入失敗', 'danger');
      return r.ok ? h('span', { text: r.source === 'osm' ? '免費來源' : 'Google' }) : TR.ui.badge('查無', 'neutral');
    }
    function columns(){
      return [
        { key: 'sel', label: '', className: 'plc-sel', mobile: 'select', render: function(r){
          if (!(r.ok && r.state !== 'written')) return null;
          var cb = h('input', { type: 'checkbox', checked: !!r.checked, attrs: { 'aria-label': '選取「' + r.name + '」' } });
          cb.addEventListener('change', function(){ rows[r.idx].checked = cb.checked; updateWrite(); });
          return h('label', { class: 'check is-bare' }, cb);
        } },
        { key: 'name', label: '名稱', mobile: 'title', render: function(r){
          return h('div', { class: 'plc-cell' }, h('span', { class: 'plc-name', text: r.name }), r.addr ? h('span', { class: 'plc-sub', text: r.addr }) : null);
        } },
        { key: 'display', label: '查到的地方', mobile: 'meta', render: function(r){ return h('span', { class: 'plc-sub', text: String(r.display || '—').slice(0, 48) }); } },
        { key: 'coord', label: '座標', mobile: 'meta', render: function(r){ return r.ok ? mapLink(r.lat, r.lng, 4) : '—'; } },
        { key: 'state', label: '狀態', mobile: 'sub', render: batchStateNode }
      ];
    }
    function render(){
      var list = (hideChk.input.checked ? rows.filter(function(r){ return r.state !== 'written' && r.state !== 'dup'; }) : rows)
        .map(function(r){ return Object.assign({}, r); });
      if (!table) {
        table = TR.ui.table({ columns: columns(), rows: list, rowKey: function(r){ return 'b' + r.idx; }, empty: '沒有要顯示的項目' });
        tableHost.appendChild(table.el);
      } else {
        table.update(list);
      }
      updateWrite();
    }
    function updateWrite(){
      var selectable = rows.filter(function(r){ return r.ok && r.state !== 'written'; });
      var n = selectable.filter(function(r){ return r.checked; }).length;
      allChk.input.checked = selectable.length > 0 && n === selectable.length;
      allChk.input.indeterminate = n > 0 && n < selectable.length;
      setBtnLabel(writeBtn, '寫入勾選的 ' + n + ' 筆');
      writeBtn.hidden = n === 0 || running;
      writeBtn.disabled = writing;
    }
    function setLookup(){
      lookupBtn.disabled = running || writing;
      setBtnLabel(lookupBtn, running ? '查詢中…' : (rows.length ? '重新查座標' : '開始查座標'));
      ta.disabled = running || writing;
    }
    function updateLineCount(){
      var n = parseLines(ta.value).length;
      lineCount.textContent = n + ' / 200 行';
    }
    function startLookup(){
      if (running || writing) return;
      var lines = parseLines(ta.value);
      if (!lines.length) { TR.toast({ type: 'info', text: '先貼上清單,一行一筆' }); return; }
      if (lines.length > 200) { TR.toast({ type: 'err', text: '一次最多 200 筆,請分批' }); return; }
      rows = lines.map(function(l, i){
        var p = l.split(/[|\t]/).map(function(s){ return s.trim(); });
        return { idx: i, name: p[0], addr: p[1] || '', ok: false, checked: false, state: 'pending', lat: 0, lng: 0, display: '', source: '' };
      });
      running = true;
      dctl.setDirty(true);
      resultsWrap.hidden = false;
      setLookup();
      render();
      (async function(){
        for (var i = 0; i < rows.length; i++) {
          if (cancelled) return;
          var r = rows[i];
          r.state = 'looking';
          progress.textContent = '查詢中 ' + (i + 1) + ' / ' + rows.length + ':' + r.name;
          render();
          var res = await TR.api('suggestCoords', { q: r.addr || r.name });
          if (cancelled) return;
          if (res && res.ok && finite(res.lat) && finite(res.lng)) {
            r.ok = true; r.checked = true; r.lat = Number(res.lat); r.lng = Number(res.lng);
            r.display = String(res.display || ''); r.source = String(res.source || '');
          }
          r.state = 'done';
          render();
          if (i < rows.length - 1) await TR.sleep(1100);
        }
        running = false;
        var okN = rows.filter(function(x){ return x.ok; }).length;
        progress.textContent = '查完:' + okN + ' / ' + rows.length + ' 筆有座標。逐筆核對後按寫入。';
        setLookup();
        render();
      })().catch(function(e){ running = false; setLookup(); TR.reportError(e); });
    }
    function startWrite(){
      if (running || writing) return;
      var todo = rows.filter(function(r){ return r.ok && r.checked && r.state !== 'written'; });
      if (!todo.length) { TR.toast({ type: 'info', text: '沒有勾選任何一筆' }); return; }
      TR.dialog.confirm({
        level: 'C',
        title: '把 ' + todo.length + ' 筆寫進位置庫?',
        body: '寫入後標為已驗證,App 立刻採用。',
        confirmText: '寫入 ' + todo.length + ' 筆'
      }).then(async function(ok){
        if (!ok || cancelled) return;
        writing = true;
        dctl.setBusy(true);
        setLookup();
        updateWrite();
        var okN = 0, dupN = 0, failN = 0;
        for (var k = 0; k < todo.length; k++) {
          if (cancelled) break;
          var r = todo[k];
          progress.textContent = '寫入中 ' + (k + 1) + ' / ' + todo.length + ':' + r.name;
          var res = await TR.api('addPlace', { name: r.name, aliases: '', lat: r.lat, lng: r.lng,
            address: (r.addr || r.display), verified: true, source: '批量匯入' });
          if (res && res.ok) { r.state = 'written'; okN++; }
          else if (res && res.error === 'dup_alias') { r.state = 'dup'; dupN++; }
          else { r.state = 'failed'; failN++; }
          render();
        }
        writing = false;
        dctl.setBusy(false);
        var summary = '寫入完成:' + okN + ' 筆成功、' + dupN + ' 筆已存在(略過)、' + failN + ' 筆失敗';
        progress.textContent = summary;
        if (!cancelled) TR.toast({ type: failN ? 'err' : 'ok', text: summary });
        setLookup();
        render();
        if (S.mounted) loadPlaces({ research: true });
        TR.data.load('placeCands', { force: true });
        TR.data.load('missQueue', { force: true });
      }).catch(function(e){ writing = false; TR.reportError(e); });
    }

    TR.drawer({
      title: '批量匯入',
      wide: true,
      onClose: function(){ cancelled = true; },
      render: function(body, ctl){
        dctl = ctl;
        var taId = 'plc-batch-input';
        ta = h('textarea', { class: 'textarea', id: taId, rows: 8, placeholder: '吉祥大樓\n老爺酒店 | 台北市中山區中山北路二段37之1號', attrs: { 'data-initial': '', spellcheck: 'false' } });
        ta.addEventListener('input', updateLineCount);
        lineCount = h('span', { class: 'plc-batch-count' }, '0 / 200 行');
        lookupBtn = TR.ui.button({ label: '開始查座標', variant: 'primary', icon: 'search', onClick: startLookup });
        progress = h('p', { class: 'plc-batch-progress', attrs: { role: 'status' } });
        allChk = checkBox('全選', false, function(on){
          rows.forEach(function(r){ if (r.ok && r.state !== 'written') r.checked = on; });
          render();
        });
        hideChk = checkBox('隱藏已處理', false, function(){ render(); });
        writeBtn = TR.ui.button({ label: '寫入勾選的 0 筆', variant: 'primary', onClick: startWrite });
        writeBtn.hidden = true;
        tableHost = h('div');
        resultsWrap = h('div', { class: 'plc-batch-results', hidden: true },
          h('div', { class: 'toolbar' }, allChk.el, hideChk.el, h('span', { class: 'grow' }), writeBtn),
          tableHost);
        body.appendChild(h('div', { class: 'plc-batch-top' },
          h('p', null, '一行一筆,可只寫名稱,或寫「名稱 | 地址」。查完逐筆核對再寫入。', TR.ui.info('會先用免費來源查,查不到才用 Google。寫入後直接標為已驗證,App 立刻使用。每筆間隔約 1 秒,一次最多 200 筆。')),
          h('p', { class: 'plc-note', text: '⚠ 查不到時會改用 Google,可能產生費用。' }),
          h('div', { class: 'field' }, h('label', { class: 'field-label', for: taId, text: '清單' }), ta),
          h('div', { class: 'toolbar' }, lookupBtn, lineCount),
          progress));
        body.appendChild(resultsWrap);
      }
    });
  }

  /* ---------- page ---------- */
  function subtitle(){
    var c = TR.data.count(TR.data.value('placeCands'));
    var m = TR.data.count(TR.data.value('missQueue'));
    if (!S.places && !c && !m) return '';
    var pending = { n: (c ? c.n : 0) + (m ? m.n : 0), plus: !!(c && c.plus) || !!(m && m.plus) };
    return (S.places ? num(S.placesTotal != null ? S.placesTotal : S.places.length) : '—') + ' 個地點・' + TR.fmt.count(pending) + ' 筆待處理';
  }
  function onStore(){
    if (!S.mounted) return;
    if (S.section.hidden || TR.router.current().page !== NAME) { S.stale = true; return; }
    updateCounts();
    if (TR.busy.isInteracting(S.section)) TR.busy.whenIdle(S.section, renderPending);
    else renderPending();
  }
  function loadAll(force){
    var ps = [
      loadPlaces({ research: !!force }),
      TR.data.load('placeCands', { force: force }),
      TR.data.load('missQueue', { force: force }),
      loadGaStats()
    ];
    if (S.missAll && (force || !S.missAllData)) ps.push(loadMissAll());
    if (force && S.gaLast) ps.push(gaReload());
    return Promise.all(ps);
  }
  function applyGaParam(ga, scroll){
    if (!ga) return;
    if (S.gaLast && S.gaLast.kind === 'search' && S.gaLast.q === ga) return;
    UI.gaCard.setOpen(true);
    UI.gaSearch.set(ga);
    gaSearch(ga);
    if (scroll) setTimeout(function(){ try { UI.gaCard.el.scrollIntoView({ block: 'start' }); } catch (e) {} }, 0);
  }
  function mount(section, ctx){
    var params = (ctx && ctx.params) || {};
    S.section = section;
    S.mounted = true;
    S.tab = params.tab === 'miss' ? 'miss' : 'cands';
    S.query = params.q || '';
    section.textContent = '';
    buildGaStats(section);
    buildPending(section);
    buildPlaces(section);
    buildGa(section);
    TR.data.subscribe('placeCands', onStore);
    TR.data.subscribe('missQueue', onStore);
    renderPending();
    renderPlaces();
    renderGaStats();
    applyGaParam(params.ga || '', true);
    return loadAll(false).then(function(){ TR.page.markUpdated(NAME); });
  }
  function refresh(opts){
    var src = opts && opts.source;
    if (!S.mounted) return Promise.resolve();
    if (src === 'user') return loadAll(true).then(function(){ TR.page.markUpdated(NAME); });
    if (src === 'show') {
      if (S.stale) { S.stale = false; renderPending(); }
      renderPlaces();
      var ps = [TR.data.load('placeCands'), TR.data.load('missQueue')];
      if (Date.now() - S.placesAt > 300000) ps.push(loadPlaces());
      return Promise.all(ps);
    }
    return Promise.resolve();
  }
  function onParams(p){
    if (!S.mounted) return;
    var tab = p.tab === 'miss' ? 'miss' : 'cands';
    if (tab !== S.tab) { S.tab = tab; UI.tabs.set(tab); showTab(); }
    var q = p.q || '';
    if (q !== S.query.trim()) { S.query = q; UI.placeSearch.set(q); syncSearch(true); renderPlaces(); }
    applyGaParam(p.ga || '', true);
  }

  TR.page.register(NAME, {
    title: '位置庫',
    subtitle: subtitle,
    actions: function(slot){
      if (!isAdmin()) return;
      slot.appendChild(TR.ui.button({ label: '新增地點', variant: 'primary', icon: 'plus', onClick: function(){ openForm(null); } }));
      slot.appendChild(TR.ui.menuButton([{ label: '批量匯入', onClick: function(){ openBatch(); } }], { label: '位置庫更多動作' }));
    },
    mount: function(section, ctx){
      var r = mount(section, ctx);
      if (r && r.catch) r.catch(TR.reportError);
    },
    refresh: refresh,
    onParams: onParams
  });
})();
TR.boot();
</script>
</body>
